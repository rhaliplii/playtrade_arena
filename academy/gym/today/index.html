[10000, 9900, 9801, 9703, 9606, 9510, 9415, 9321, 9227, 9135, 9044]}, {"label": "10% risk", "tone": "down", "dots": true, "values": [10000, 9000, 8100, 7290, 6561, 5905, 5314, 4783, 4305, 3874, 3487]}]}, "options": [{"text": "$0: 10 × 10% = 100%", "feedback": "Each loss is 10% of a smaller account, so you never quite hit $0. But you’ve lost about two-thirds."}, {"text": "About $3,500", "feedback": "About $3,500 left. You’d need +187% just to get back to even."}, {"text": "About $9,000", "feedback": "That’s what 1% risk would leave. At 10% a trade, each loss is ten times bigger."}], "answer": 1, "idea": "losing-streak-compounds", "work": "Each loss takes 10% of what’s left. $10,000 × 0.9¹⁰ ≈ $3,500. At 1% a trade: ≈ $9,040."}}], "one-percent-risk": [{"lesson": "one-percent-rule", "chapter": "risk-management", "card": {"type": "exercise", "kind": "choice", "title": "Set your risk", "q": "Your account is $25,000. Using the [[one-percent-rule|1% rule]], what’s the most you should risk on one trade?", "idea": "one-percent-risk", "options": [{"text": "$25", "feedback": "That’s 0.1% of the account. Move the decimal one place: 1% of $25,000 is ten times more."}, {"text": "$250", "feedback": "1% of $25,000. Lose it 10 times in a row and you’re still down only about 10%."}, {"text": "$2,500", "feedback": "$2,500 is 10% of the account. Ten bad trades like that would cost you most of it."}, {"text": "$1,000", "feedback": "That’s 4% of the account. A normal losing streak at that size would cut deep."}], "answer": 1, "work": "$25,000 × 1% = $250."}}, {"chapter": "risk-management", "challenge": {"lesson": 2, "q": "Your account is $8,000 and you follow the 1% rule. What’s the most you should lose on one trade?", "options": ["$800", "$8", "$80"], "answer": 2, "why": "$800 is 10% of the account. A short losing streak at that size would wipe out most of it.", "work": "$8,000 × 1% = $80 at most per trade.", "idea": "one-percent-risk"}}], "risk-means-stop-loss": [{"lesson": "one-percent-rule", "chapter": "risk-management", "card": {"type": "check", "title": "What “risk 1%” means", "q": "You “risk 1%” on each trade. What does that mean?", "options": [{"text": "Buy stock worth 1% of the account", "feedback": "The 1% is the loss if the stop is hit, not the size of the position."}, {"text": "Lose about 1% of the account if the stop is hit", "feedback": "Risk is the loss at your stop. The position itself can be much bigger."}, {"text": "Aim for a 1% gain on every trade", "feedback": "The rule is about losses, not targets. It caps what one bad trade can take."}, {"text": "Trade on 1% of the days", "feedback": "It’s not about how often you trade. It caps what you lose if the stop is hit."}], "answer": 1, "idea": "risk-means-stop-loss", "work": null}}], "position-size-formula": [{"lesson": "position-sizing", "chapter": "risk-management", "card": {"type": "call", "pose": "think", "title": "How many shares?", "situation": "$10,000 account, 1% risk. You buy at $50 with a stop at $48. How many shares should you buy?", "visual": {"kind": "fields", "items": [{"label": "Account", "value": "$10,000"}, {"label": "Risk", "value": "1%"}, {"label": "Entry", "value": "$50", "tone": "blue"}, {"label": "Stop", "value": "$48", "tone": "down"}]}, "options": [{"text": "200: all you can afford", "feedback": "200 shares × $2 = $400 at risk. That’s 4% of the account, not 1%."}, {"text": "50 shares", "feedback": "50 shares. If the stop is hit, you lose about $100, or 1%."}, {"text": "2 shares", "feedback": "That’s the dollars lost per share, not the share count. Divide your $100 risk by it."}], "answer": 1, "idea": "position-size-formula", "work": "$10,000 × 1% = $100. $50 − $48 = $2 a share. $100 ÷ $2 = 50 shares."}}, {"chapter": "risk-management", "challenge": {"lesson": 3, "q": "$15,000 account, 1% risk. You buy at $25 with a stop at $22. How many shares should you buy?", "visual": {"kind": "candles", "title": "Your trade plan", "aside": "$15,000 · 1% risk", "chart": {"path": [[0, 23.1], [1, 23.6], [2, 23.3], [3, 24.0], [4, 23.8], [5, 24.5], [6, 24.3], [7, 25]], "noise": 0.25, "wick": 0.4, "seed": 55, "future": 6, "height": 90, "axis": false, "lastTag": false, "ticks": 0, "hlines": [{"price": 25, "tone": "blue", "label": "Entry $25", "style": "text"}, {"price": 22, "tone": "down", "label": "Stop $22", "style": "text"}], "label": "Price rises to an entry at $25, with a stop at $22"}}, "options": ["600: all you can afford", "50 shares", "6 shares"], "answer": 1, "why": "Your risk is $150 and each share loses $3 at the stop. 600 shares would put $1,800 at risk: 12% of the account.", "work": "$15,000 × 1% = $150. $25 − $22 = $3. $150 ÷ $3 = 50 shares.", "idea": "position-size-formula"}}], "size-the-trade": [{"lesson": "position-sizing", "chapter": "risk-management", "card": {"type": "exercise", "kind": "choice", "title": "Size the trade", "q": "$20,000 account, 1% risk. Entry $40, stop $36. How many shares?", "idea": "size-the-trade", "options": [{"text": "5 shares", "feedback": "The decimal slipped. Your $200 risk ÷ $4 a share is ten times that."}, {"text": "50 shares", "feedback": "$200 of risk ÷ $4 a share. If the stop is hit, you lose 1%."}, {"text": "100 shares", "feedback": "That’s $400 at risk, 2% of the account. Use the full $4 gap between entry and stop."}, {"text": "500 shares", "feedback": "500 shares is the whole account. A $4 drop would cost $2,000, which is 10%."}], "answer": 1, "work": "$20,000 × 1% = $200. $40 − $36 = $4. $200 ÷ $4 = 50 shares."}}], "wider-stop-fewer-shares": [{"lesson": "position-sizing", "chapter": "risk-management", "card": {"type": "check", "title": "Move the stop", "q": "Same account, same 1% risk. You move your stop further from your entry. What happens to the number of shares?", "options": [{"text": "It goes up", "feedback": "It’s the other way round. Each share now loses more at the stop, so you can hold fewer."}, {"text": "It goes down", "feedback": "More dollars at risk per share means fewer shares for the same dollar risk."}, {"text": "It stays the same", "feedback": "More dollars lost per share means fewer shares for the same dollar risk."}, {"text": "It doubles", "feedback": "A wider stop costs more per share, so the count can’t go up. It shrinks."}], "answer": 1, "idea": "wider-stop-fewer-shares", "work": null}}], "stop-below-the-low": [{"lesson": "where-to-put-the-stop", "chapter": "risk-management", "card": {"type": "call", "pose": "detective", "title": "Where’s the stop?", "situation": "The stock pulled back to a low of $47.20, then turned up. You buy at $50. Where should your stop go?", "visual": {"kind": "candles", "title": "Daily", "aside": "buy at $50", "chart": {"ohlc": [[46.04, 47.39, 45.65, 47.2], [47.2, 49.13, 47.01, 48.94], [48.94, 51.16, 48.75, 50.87], [50.87, 51.45, 49.33, 49.71], [49.71, 49.91, 47.97, 48.36], [48.36, 48.75, 47.2, 47.97], [47.98, 49.52, 47.78, 49.33], [49.32, 50.29, 49.04, 50.0]], "axis": false, "lastTag": false, "ticks": 0, "height": 120, "label": "Rally, pullback to a low of $47.20, then a turn up to $50", "hlines": [{"price": 47.2, "tone": "gold", "label": "low $47.20", "style": "below"}]}}, "options": [{"text": "$49: you only want to lose $1", "feedback": "$49 is about comfort, not the chart. A normal wobble can hit it while your idea is still fine."}, {"text": "About $47, just below the pullback low", "feedback": "Below the low is where your idea is proven wrong. That’s where the stop belongs."}, {"text": "No stop: you’ll watch it closely", "feedback": "Watching isn’t a plan. Without a stop, one bad day can turn a small loss into a big one."}], "answer": 1, "idea": "stop-below-the-low", "work": "Pullback low $47.20. Stop $47. If price breaks that low, the bounce has failed."}}, {"chapter": "risk-management", "challenge": {"lesson": 4, "q": "You buy at $120 after a pullback. The pullback low was $114. Where does your stop belong?", "visual": {"kind": "candles", "title": "Daily · 2 weeks", "chart": {"ohlc": [[106.0, 108.4, 105.4, 108.0], [108.0, 111.2, 107.6, 110.8], [110.8, 114.6, 110.4, 114.2], [114.2, 118.2, 113.8, 117.8], [117.8, 122.4, 117.4, 122.0], [122.0, 125.6, 121.6, 125.2], [125.2, 125.8, 121.4, 121.8], [121.8, 122.2, 117.6, 118.0], [118.0, 118.6, 114.0, 115.2], [115.2, 117.6, 114.6, 117.2], [117.2, 120.4, 116.8, 120.0]], "height": 110, "axis": false, "lastTag": false, "ticks": 0, "hlines": [{"price": 120, "tone": "blue", "label": "Buy $120", "style": "text"}, {"price": 114, "tone": "gold", "label": "Low $114", "style": "below"}], "label": "Rally to $125, pullback to a $114 low, then a turn up to $120"}}, "options": ["$119: you hate big losses", "A little below $114", "$90: far away to be safe"], "answer": 1, "why": "The idea is proven wrong only if price breaks the pullback low. A stop $1 under the entry sits in the noise; one $30 away makes the size tiny.", "idea": "stop-below-the-low"}}], "stop-below-the-zone": [{"lesson": "where-to-put-the-stop", "chapter": "risk-management", "card": {"type": "exercise", "kind": "choice", "title": "Place the stop", "q": "Support runs from $79.50 to $80.50. You buy at $82 after a bounce off it. Where should your stop go?", "idea": "stop-below-the-zone", "options": [{"text": "$81.50", "feedback": "$81.50 sits above the zone. A normal dip into support would stop you out."}, {"text": "$79", "feedback": "Just below the whole zone. If price breaks $79.50, support has failed."}, {"text": "$65", "feedback": "That’s far below the zone. It risks $17 a share, so your size would be tiny and the target hard to reach."}, {"text": "No stop", "feedback": "Without a stop, a break of support can run much further. Plan the exit before you enter."}], "answer": 1, "work": "Zone bottom $79.50. Stop $79. Risk $82 − $79 = $3 a share."}}], "fewer-shares-not-tighter-stop": [{"lesson": "where-to-put-the-stop", "chapter": "risk-management", "card": {"type": "check", "title": "Too much risk?", "q": "Your logical stop at $47 means $3 risk a share. That feels like a lot. What’s the right fix?", "options": [{"text": "Move the stop up to $49", "feedback": "Moving the stop to $49 puts it inside the noise. Keep the stop where the idea fails and shrink the size."}, {"text": "Keep the stop, buy fewer shares", "feedback": "The stop stays where the idea fails. Fewer shares bring the dollar risk back to 1%."}, {"text": "Skip the stop", "feedback": "No stop means no limit at all. Keep the stop and make the position smaller."}, {"text": "Buy more shares to make it worth it", "feedback": "More shares means more dollars at risk, not less. Shrink the size instead."}], "answer": 1, "idea": "fewer-shares-not-tighter-stop", "work": null}}], "reward-beats-win-rate": [{"lesson": "reward-to-risk", "chapter": "risk-management", "card": {"type": "call", "pose": "think", "title": "Which setup pays?", "situation": "You win 4 trades out of 10. Setup A risks $2 to make $2. Setup B risks $2 to make $6. Which one pays over time?", "visual": {"kind": "stack", "layout": "row", "items": [{"kind": "rr", "compact": true, "title": "Setup A", "aside": "1:1", "entry": 50, "stop": 48, "target": 52, "label": "Setup A: risk $2 to make $2"}, {"kind": "rr", "compact": true, "title": "Setup B", "aside": "3:1", "entry": 50, "stop": 48, "target": 56, "label": "Setup B: risk $2 to make $6"}]}, "options": [{"text": "Setup A", "feedback": "At 1:1 you need to win more than half your trades. At 40%, A slowly loses."}, {"text": "Setup B", "feedback": "B’s wins are three times its losses. That pays even when you’re wrong 6 times in 10."}, {"text": "Both the same: you win 40% either way", "feedback": "Same win rate, different payoffs. What each win pays compared with each loss decides the result."}], "answer": 1, "idea": "reward-beats-win-rate", "work": "10 trades, 4 wins, 6 losses. A: 4 × $2 − 6 × $2 = −$4. B: 4 × $6 − 6 × $2 = +$12."}}], "reward-to-risk-ratio": [{"lesson": "reward-to-risk", "chapter": "risk-management", "card": {"type": "exercise", "kind": "choice", "title": "Work out the ratio", "q": "Entry $30, stop $28, target $36. What’s the reward-to-risk?", "idea": "reward-to-risk-ratio", "visual": {"kind": "rr", "title": "Trade plan", "entry": 30, "stop": 28, "target": 36, "label": "Entry $30, stop $28, target $36"}, "options": [{"text": "1:3", "feedback": "That’s upside down. Reward goes first: $6 of reward against $2 of risk."}, {"text": "2:1", "feedback": "$2 is the risk, not the ratio. Divide the $6 reward by it."}, {"text": "3:1", "feedback": "$6 of reward for $2 of risk: three dollars for every one you put on the line."}, {"text": "6:1", "feedback": "$6 is the reward. Divide it by the $2 risk."}], "answer": 2, "work": "$36 − $30 = $6. $30 − $28 = $2. $6 ÷ $2 = 3:1."}}, {"chapter": "risk-management", "challenge": {"lesson": 5, "q": "Entry $40, stop $38. Which target gives a reward-to-risk of at least 2:1?", "visual": {"kind": "candles", "title": "Your trade plan", "chart": {"path": [[0, 38.9], [1, 39.3], [2, 39.1], [3, 39.6], [4, 39.4], [5, 40]], "noise": 0.25, "wick": 0.4, "seed": 55, "future": 6, "height": 170, "axis": false, "lastTag": false, "ticks": 0, "hlines": [{"price": 44, "tone": "muted", "label": "$44", "style": "text"}, {"price": 42, "tone": "muted", "label": "$42", "style": "text"}, {"price": 41, "tone": "muted", "label": "$41", "style": "text"}, {"price": 40, "tone": "blue", "label": "Entry $40", "style": "text"}, {"price": 38, "tone": "down", "label": "Stop $38", "style": "text"}], "label": "Entry $40, stop $38, possible targets $41, $42 and $44"}}, "options": ["$41", "$42", "$44"], "answer": 2, "why": "You risk $2 a share, so 2:1 needs $4 of reward above the $40 entry. The lower targets pay only $1 or $2.", "work": "$44 − $40 = $4. $40 − $38 = $2. $4 ÷ $2 = 2:1.", "idea": "reward-to-risk-ratio"}}], "break-even-win-rate": [{"lesson": "reward-to-risk", "chapter": "risk-management", "card": {"type": "check", "title": "Win rate 40%", "q": "You win about 4 trades in 10. Which reward-to-risk can keep you profitable over time, before fees?", "options": [{"text": "1:1", "feedback": "At 1:1 you need to win over 50%. At 2:1, 40% is enough: 4 × $2 − 6 × $1 = +$2."}, {"text": "2:1", "feedback": "At 2:1 you break even at about 33%, so 40% wins pays: 4 × $2 − 6 × $1 = +$2."}, {"text": "1:2", "feedback": "At 1:2 each win is half a loss. You’d need to win about two trades in three."}, {"text": "It doesn’t matter", "feedback": "It matters a lot. With 40% wins, only a reward bigger than the risk keeps you ahead."}], "answer": 1, "idea": "break-even-win-rate", "work": null}}], "expectancy-pays": [{"lesson": "expectancy", "chapter": "risk-management", "card": {"type": "call", "pose": "detective", "title": "Does it pay?", "situation": "Your journal shows you win 40% of trades. Your average win is $300. Your average loss is $100. Does your strategy pay?", "visual": {"kind": "rows", "rows": [{"label": "Win rate", "value": "40%"}, {"label": "Average win", "value": "$300", "tone": "up"}, {"label": "Average loss", "value": "$100", "tone": "down"}, {"label": "Trades", "value": "120"}]}, "options": [{"text": "No: you lose most of your trades", "feedback": "Losing most trades is fine when the wins are much bigger than the losses."}, {"text": "Yes: about +$60 a trade on average", "feedback": "Your wins are big enough to cover your losses and more."}, {"text": "Can’t tell until you win more often", "feedback": "You can tell now: 120 trades is a fair sample. Weight each result by how often it happens."}], "answer": 1, "idea": "expectancy-pays", "work": "(0.4 × $300) − (0.6 × $100) = $120 − $60 = +$60 a trade."}}], "expectancy-math": [{"lesson": "expectancy", "chapter": "risk-management", "card": {"type": "exercise", "kind": "choice", "title": "Work out the expectancy", "q": "You win 50% of trades. Average win $150, average loss $100. What’s your expectancy per trade?", "idea": "expectancy-math", "options": [{"text": "+$50", "feedback": "$150 − $100 ignores how often each one happens. Weight each by its rate."}, {"text": "+$25", "feedback": "Half the time you make $150, half the time you lose $100: $75 − $50 a trade."}, {"text": "−$25", "feedback": "The sign flipped. Your wins are bigger than your losses at the same rate, so it’s above zero."}, {"text": "+$75", "feedback": "That’s only the winning half. Take off the losing half: 0.5 × $100."}], "answer": 1, "work": "(0.5 × $150) − (0.5 × $100) = $75 − $50 = +$25."}}, {"chapter": "risk-management", "challenge": {"lesson": 6, "q": "You win 30% of trades. Average win $200, average loss $100. Does your strategy pay?", "options": ["Yes: about +$30 a trade", "No: about −$10 a trade", "Yes: the wins are twice the losses"], "answer": 1, "why": "Weight each result by how often it happens. You lose 7 trades in 10, and those losses outweigh the bigger wins.", "work": "(0.3 × $200) − (0.7 × $100) = $60 − $70 = −$10 a trade.", "idea": "expectancy-math"}}], "expectancy-is-an-average": [{"lesson": "expectancy", "chapter": "risk-management", "card": {"type": "check", "title": "Reading the number", "q": "Your strategy’s expectancy is +$20 a trade. What does that mean?", "options": [{"text": "You’ll make $20 on your next trade", "feedback": "The next trade can still lose. Expectancy is an average that shows up over many trades."}, {"text": "Over many trades, you average about +$20 each", "feedback": "Some trades win, some lose. Over many of them, they average out near +$20."}, {"text": "You win 20% of your trades", "feedback": "That’s a win rate. Expectancy is dollars per trade, on average."}, {"text": "You can’t lose money", "feedback": "You can still lose, on a trade or a bad run. It only pays on average, over many trades."}], "answer": 1, "idea": "expectancy-is-an-average", "work": null}}], "win-rate-vs-payoff": [{"lesson": "fear-and-greed", "chapter": "trading-psychology", "card": {"type": "call", "title": "Winning most trades", "situation": "You close winners fast at +$50, scared the gain will vanish. You hold losers to −$150, hoping they come back. You win 6 of 10 trades. Are you making money?", "visual": {"kind": "trades", "title": "Your last 10 trades", "aside": "6 wins · 4 losses", "label": "Six wins of +$50 and four losses of −$150", "values": [50, -150, 50, 50, -150, 50, -150, 50, 50, -150], "displays": ["+50", "−150", "+50", "+50", "−150", "+50", "−150", "+50", "+50", "−150"]}, "options": [{"text": "Yes: you win most of your trades", "feedback": "Easy to miss: winning often isn’t the same as making money. The few losses are three times the size of the wins."}, {"text": "No: you’re losing money overall", "feedback": "Small wins and big losses. Fear cut the winners short and hope let the losers run."}, {"text": "You’re breaking even", "feedback": "Add it up: the four losses are bigger than the six wins put together. Each loss is three times the size of a win."}], "answer": 1, "idea": "win-rate-vs-payoff", "work": "6 wins × $50 = +$300. 4 losses × $150 = −$600. Net −$300."}}, {"chapter": "trading-psychology", "challenge": {"lesson": 1, "q": "You win 7 of 10 trades. Your wins average $40, your losses $120. Are you making money?", "options": ["Yes: 7 of 10 is a great win rate", "No: you’re down $80 overall", "You’re breaking even"], "answer": 1, "why": "A high win rate can still lose money. Each loss is three times a win, so three losses wipe out all seven wins and more.", "idea": "win-rate-vs-payoff", "work": "7 wins × $40 = +$280. 3 losses × $120 = −$360. Net −$80.", "visual": {"kind": "trades", "title": "Your last 10 trades", "labels": false, "legend": [{"label": "win", "tone": "up"}, {"label": "loss", "tone": "down"}], "label": "Seven wins of $40 and three losses of $120", "values": [40, 40, -120, 40, 40, 40, -120, 40, 40, -120]}}}], "name-the-fear": [{"lesson": "fear-and-greed", "chapter": "trading-psychology", "card": {"type": "exercise", "kind": "choice", "title": "Name the feeling", "q": "You’re up $80 on a trade with a $200 target. Nothing on the chart has changed, but you want to close now, “before it’s gone”. Which feeling is that?", "idea": "name-the-fear", "visual": {"kind": "series", "title": "Open trade", "ends": false, "height": 110, "lo": 0, "hi": 220, "label": "An open trade at +$80, with the target at +$200", "series": [{"values": [0, 10, 20, 15, 30, 40, 35, 50, 60, 55, 70, 80], "tone": "up", "area": true}], "hlines": [{"value": 200, "label": "target +$200", "tone": "up", "pos": "left"}], "points": [{"i": 11, "label": "+$80 now", "tone": "gold", "anchor": "end"}]}, "options": [{"text": "Greed", "feedback": "Easy to mix up. Greed wants more. The urge to grab a small gain before it disappears is fear of losing it."}, {"text": "Fear", "feedback": "Nothing on the chart changed. Only the feeling did: the worry that the gain will vanish."}, {"text": "Boredom", "feedback": "Boredom makes you trade when nothing is happening. Here you want out of a winner before the gain disappears."}, {"text": "Confidence", "feedback": "Confidence would let the trade run to the $200 target. Grabbing $80 “before it’s gone” comes from worry."}], "answer": 1}}], "plan-before-the-trade": [{"lesson": "fear-and-greed", "chapter": "trading-psychology", "card": {"type": "check", "title": "Best defense", "q": "What’s the best defense against fear and greed?", "options": [{"text": "Trust your gut on each trade", "feedback": "Most people go with their gut, but that’s where fear and greed live. A plan made before the trade, while you’re calm, decides for you."}, {"text": "Set entry, stop and target before you trade", "feedback": "A plan made while you’re calm decides the trade, so fear and greed don’t get a vote."}, {"text": "Watch your profit every minute", "feedback": "Watching every tick feeds the feelings. Each wiggle pulls you toward closing early or holding too long."}, {"text": "Trade bigger so each win counts", "feedback": "Bigger size makes every move feel bigger, so fear and greed get louder, not quieter."}], "answer": 1, "idea": "plan-before-the-trade"}}], "step-away-after-loss": [{"lesson": "revenge-trading-and-tilt", "chapter": "trading-psychology", "card": {"type": "call", "title": "After a bad morning", "situation": "You lost $300 on your first trade today. You’re angry. A so-so setup appears, and you want to double your size to win it back. What should you do?", "visual": {"kind": "series", "title": "Today’s P&L", "aside": "1 trade", "height": 110, "label": "Today’s profit and loss falls to −$300", "series": [{"values": [0, -40, -70, -110, -150, -190, -230, -260, -290, -300, -300], "tone": "down", "area": true, "end": "−$300"}]}, "options": [{"text": "Double up: one good trade fixes it", "feedback": "Most people feel that urge. Bigger size on a weak setup turns one bad trade into a bad week."}, {"text": "Take it at your normal size", "feedback": "Better than doubling, but anger is still choosing the trade. A so-so setup on a hot head is how one loss becomes two."}, {"text": "Skip it and step away for today", "feedback": "Anger makes bad setups look good. Stepping away keeps one loss from turning into three."}], "answer": 2, "idea": "step-away-after-loss", "work": "Down $300. Double size on a weak setup: one more loss costs $600, and the day ends at −$900."}}], "rule-beats-setup": [{"lesson": "revenge-trading-and-tilt", "chapter": "trading-psychology", "card": {"type": "exercise", "kind": "choice", "title": "Rule or setup?", "q": "Your rule: stop after 2 losses a day. It’s 11am and you’ve lost on trades 1 and 2. Then a perfect setup appears. What do you do?", "idea": "rule-beats-setup", "visual": {"kind": "list", "style": "cards", "items": [{"title": "2 losses in a day: done", "text": "Today: loss, loss.", "tone": "down"}]}, "options": [{"text": "Take it: it’s a perfect setup", "feedback": "Most people feel that pull. A rule only works if it holds on the days it hurts. Setups come back tomorrow, a blown account doesn’t."}, {"text": "Stop for the day, as your rule says", "feedback": "The rule holds on the day it hurts. Setups come back tomorrow, and your account will be there for them."}, {"text": "Take it at half size", "feedback": "Smaller size still breaks the rule. The rule is about you after two losses, not about this setup."}, {"text": "Take it at double size", "feedback": "Doubling after two losses is revenge trading. Your rule exists for exactly this moment."}], "answer": 1}}, {"chapter": "trading-psychology", "challenge": {"lesson": 2, "q": "Two $100 losses this morning hit your $200 daily limit. You feel you must win it back before lunch. What do you do?", "options": ["One more trade at double size", "One more trade at normal size", "Stop for the day, as your rule says"], "answer": 2, "why": "Most people feel that urge. Doubling up to win it back is revenge trading, and your limit exists for exactly this moment.", "idea": "rule-beats-setup", "work": "Down $200. One doubled loss adds $200 more. That’s $400 lost, twice your limit."}}], "spot-tilt": [{"lesson": "revenge-trading-and-tilt", "chapter": "trading-psychology", "card": {"type": "check", "title": "Spot the tilt", "q": "Which of these is a sign you’re on tilt?", "options": [{"text": "Keeping your normal size after a loss", "feedback": "Easy to mix up: normal size after a loss is discipline. Sizing up to win it back is tilt."}, {"text": "Raising your size to win a loss back", "feedback": "Bigger size to win it back is the classic sign: anger is choosing the trade."}, {"text": "Taking a break after a loss", "feedback": "A break after a loss is the cure for tilt, not a sign of it."}, {"text": "Writing the loss in your journal", "feedback": "Logging a loss is a calm, healthy habit. Tilt shows up as bigger size and faster trades."}], "answer": 1, "idea": "spot-tilt"}}], "chasing-risk": [{"lesson": "fomo-and-chasing", "chapter": "trading-psychology", "card": {"type": "call", "title": "Everyone’s buying", "situation": "A stock jumps 15% in an hour on one big green candle. Everyone online is buying. You have no setup. What’s the main risk of buying now?", "visual": {"kind": "candles", "title": "Hourly", "aside": "+15%", "asideTone": "up", "chart": {"ohlc": [[100, 100.6, 99.5, 100.2], [100.2, 100.7, 99.4, 99.8], [99.8, 100.5, 99.3, 100.1], [100.1, 100.6, 99.5, 99.7], [99.7, 100.4, 99.2, 100], [100, 115.6, 99.8, 115]], "height": 110, "axis": false, "lastTag": false, "ticks": 0, "marks": [{"i": 5, "price": 99.2, "label": "now", "tone": "gold", "pos": "below"}], "label": "Five flat hourly candles near $100, then one big green candle to $115"}}, "options": [{"text": "None: the move will keep going", "feedback": "Big moves often pull back. At the top of a spike, there’s nowhere sensible for a stop."}, {"text": "You buy high, with no clear stop", "feedback": "Late buyers pay the highest price and carry the most risk."}, {"text": "You’re too late to make anything", "feedback": "It might keep going, so “too late” isn’t the problem. Buying at the top of a spike leaves nowhere sensible for a stop."}], "answer": 1, "idea": "chasing-risk", "work": "Bought at $115 after a run from $100. A dip to $107 = −$8 a share, over half the move."}}], "chase-raises-risk": [{"lesson": "fomo-and-chasing", "chapter": "trading-psychology", "card": {"type": "exercise", "kind": "choice", "title": "You missed the breakout", "q": "Your plan: buy at $50, stop at $48. You missed it. Now it’s $56 and rising. What should you do?", "idea": "chase-raises-risk", "options": [{"text": "Buy now: it’s still rising", "feedback": "Most people feel that urge. Chasing changes the trade: same stop, four times the risk."}, {"text": "Skip it, or wait for a pullback", "feedback": "Your plan only worked near $50. Letting it go, or waiting for a pullback, keeps the risk you planned."}, {"text": "Buy double to make up for missing it", "feedback": "Double size at a worse price is FOMO and revenge at once: eight times the risk you planned."}, {"text": "Sell short: it’s too high", "feedback": "“Too high” isn’t a setup. Shorting a rising stock with no plan is just a different chase."}], "answer": 1, "work": "Planned: $50 − $48 = $2 a share. Now: $56 − $48 = $8 a share."}}], "fomo-fix": [{"lesson": "fomo-and-chasing", "chapter": "trading-psychology", "card": {"type": "check", "title": "Beat the FOMO", "q": "What’s the best fix for FOMO?", "options": [{"text": "Trade every big move so you never miss out", "feedback": "Chasing every big move means buying late, again and again. That’s FOMO as a strategy."}, {"text": "Write your setup down and enter only when it shows", "feedback": "A written setup tells you when to act, and when to sit out."}, {"text": "Follow what’s trending online", "feedback": "Easy to fall for: trending stocks are where FOMO is loudest. A written setup tells you when to act, and when to sit out."}, {"text": "Use bigger size on hot stocks", "feedback": "Bigger size on a hot stock makes the chase more expensive when it pulls back."}], "answer": 1, "idea": "fomo-fix"}}, {"chapter": "trading-psychology", "challenge": {"lesson": 3, "q": "A stock you don’t follow is up 40% this week and all over your feed. You have no plan for it. What’s the disciplined move?", "options": ["Buy a little, just in case", "Let it go: no setup, no trade", "Buy now, make a plan later"], "answer": 1, "why": "A move you didn’t plan, where FOMO is loudest. With no setup there’s no entry and no stop. Another setup always comes.", "idea": "fomo-fix", "visual": {"kind": "candles", "title": "Daily · 2 months", "aside": "not on your watchlist", "chart": {"path": [[0, 50], [6, 51], [12, 50.5], [18, 51.5], [24, 50.8], [30, 51], [33, 53], [35, 60], [37, 70]], "seed": 61, "noise": 0.5, "height": 110, "axis": false, "lastTag": false, "ticks": 0, "zones": [{"from": 33, "to": 37, "tone": "gold"}], "marks": [{"i": 37, "price": 70, "label": "+40% this week", "tone": "gold", "pos": "above"}], "label": "Two flat months near $50, then a jump to $70 in one week"}}}}], "loss-aversion-bet": [{"lesson": "loss-aversion", "chapter": "trading-psychology", "card": {"type": "call", "title": "A fair coin flip", "situation": "Heads, you win $100. Tails, you lose $100. The coin is fair. Most people say no to this bet. Why?", "visual": {"kind": "stats", "items": [{"label": "Heads", "value": "+$100", "tone": "up"}, {"label": "Tails", "value": "−$100", "tone": "down"}]}, "options": [{"text": "The odds are against them", "feedback": "A fair coin gives even odds. People refuse because the loss would hurt more than the win would please."}, {"text": "Losing $100 feels worse than winning $100 feels good", "feedback": "That’s loss aversion. Studies find a loss hurts about twice as much as an equal gain feels good."}, {"text": "The bet is too small to bother", "feedback": "Size isn’t the reason: people turn down small fair bets too. The loss would hurt more than the win would please."}], "answer": 1, "idea": "loss-aversion-bet", "work": "50% × +$100 and 50% × −$100: on average, $0. The odds are even. The feelings are not."}}], "let-the-stop-work": [{"lesson": "loss-aversion", "chapter": "trading-psychology", "card": {"type": "exercise", "kind": "choice", "title": "The stop is hit", "q": "You bought 100 shares at $40, stop at $37. Price hits $37. You think “it’ll come back”. What now?", "idea": "let-the-stop-work", "options": [{"text": "Move the stop down to $34", "feedback": "Moving the stop is hope, not a plan. Each move makes the possible loss bigger."}, {"text": "Let the stop sell and take the loss", "feedback": "That’s the plan working: a small loss, taken on purpose, as you decided before the trade."}, {"text": "Buy more to lower your average price", "feedback": "Buying more makes a losing trade bigger right when your plan says it’s wrong."}, {"text": "Remove the stop and wait", "feedback": "With no stop, a planned $300 loss has no limit. Hope is not a stop."}], "answer": 1, "work": "$3 × 100 shares = about a $300 loss, as planned. A gap can make it a bit more."}}], "loss-aversion-meaning": [{"lesson": "loss-aversion", "chapter": "trading-psychology", "card": {"type": "check", "title": "In one line", "q": "Loss aversion means…", "options": [{"text": "Losses don’t happen often", "feedback": "Losses happen to every trader. Loss aversion is about how much they hurt, not how often they come."}, {"text": "A loss feels about twice as bad as an equal gain feels good", "feedback": "Losses sting about twice as much, which tempts you to avoid taking them."}, {"text": "Good traders never take losses", "feedback": "Every trader takes losses. Loss aversion is the extra pain they cause, which tempts you to avoid taking them."}, {"text": "Losers should be held until they recover", "feedback": "That’s the mistake loss aversion tempts you into, not what it means."}], "answer": 1, "idea": "loss-aversion-meaning"}}, {"chapter": "trading-psychology", "challenge": {"lesson": 4, "q": "You’re down 20% on a stock. You tell yourself you’ll sell “once it’s back to even”. Which bias is this?", "options": ["FOMO", "Loss aversion", "Revenge trading"], "answer": 1, "why": "Waiting for “even” dodges the pain of making the loss real. But the loss is already real. Ask: would I buy this today, at this price?", "idea": "loss-aversion-meaning"}}], "why-keep-a-journal": [{"lesson": "trading-journal", "chapter": "trading-psychology", "card": {"type": "call", "title": "“I’m doing OK”", "situation": "You’ve made 40 trades in two months and written nothing down. You feel you’re doing OK. What can’t you tell without a record?", "visual": {"kind": "series", "title": "40 trades · no notes", "aside": "why?", "ends": false, "height": 100, "label": "An account line that wanders up and down and ends a little lower", "series": [{"values": [0, 60, 30, 110, 80, 150, 120, 60, 90, 20, 50, -30, -10, -90, -140], "tone": "muted", "area": true}]}, "options": [{"text": "Nothing: your memory is enough", "feedback": "Everyone’s memory keeps the big wins and quietly drops the small losses. Only a record shows what really works."}, {"text": "Which setups make money and which lose it", "feedback": "Without notes you can’t see which trades to repeat and which to stop."}, {"text": "How many trades you made", "feedback": "Your broker already counts your trades. What it can’t tell you is why each one won or lost."}], "answer": 1, "idea": "why-keep-a-journal", "work": "Your broker shows 22 wins and 18 losses, net −$140. Your memory said “doing OK”."}}], "on-plan-or-not": [{"lesson": "trading-journal", "chapter": "trading-psychology", "card": {"type": "exercise", "kind": "choice", "title": "On plan or not?", "q": "Here’s your entry for trade #42. Was the −$2 loss on plan?", "idea": "on-plan-or-not", "visual": {"kind": "rows", "icon": "journal", "title": "Journal · trade #42", "aside": "Thu", "rows": [{"label": "Setup", "value": "Breakout above $25"}, {"label": "Entry", "value": "$25.40"}, {"label": "Stop", "value": "$24", "tone": "down"}, {"label": "Target", "value": "$30", "tone": "up"}, {"label": "Result", "value": "−$2 a share", "tone": "down"}, {"label": "Emotion", "value": "Rushed", "tone": "gold"}]}, "options": [{"text": "Yes: −$2 is a small loss", "feedback": "Easy to miss: small isn’t the test. The stop set the plan. Losing more means the stop was moved or ignored."}, {"text": "No: you lost more than planned", "feedback": "The stop capped the plan at about $1.40 a share. Losing $2 means it was moved or ignored, and “Rushed” hints why."}, {"text": "Yes: your target was $30", "feedback": "The target doesn’t decide this. Compare the loss with the distance from entry to stop."}, {"text": "You can’t tell from this entry", "feedback": "The entry has what you need: entry, stop and result. Compare the loss with the risk you planned."}], "answer": 1, "work": "Planned: $25.40 − $24 = about $1.40 a share. Actual: $2."}}], "log-the-emotion": [{"lesson": "trading-journal", "chapter": "trading-psychology", "card": {"type": "check", "title": "Why the feelings?", "q": "Why should you log your emotion as well as the numbers?", "options": [{"text": "It makes the journal look complete", "feedback": "It isn’t for looks. The emotion line is where your losing patterns show up."}, {"text": "It shows which feelings lead to your losing trades", "feedback": "The numbers show what happened. The emotion shows why, and that’s the part you can change."}, {"text": "Your broker needs it", "feedback": "Your broker never sees your journal. It’s for you, to find the feelings behind your trades."}, {"text": "Emotions don’t matter if the numbers are right", "feedback": "The numbers show what happened. The emotion shows why, and that’s the part you can change."}], "answer": 1, "idea": "log-the-emotion"}}], "share-is-ownership": [{"lesson": "what-a-share-really-is", "chapter": "company-fundamentals", "card": {"type": "call", "title": "What did you buy?", "situation": "Northwind Bakery is split into 100 equal shares. You buy 5 of them. What do you own?", "visual": {"kind": "units", "total": 100, "on": 5, "cols": 10, "tone": "gold", "title": "Northwind Bakery", "sub": "100 shares in total", "mark": "Your 5 shares", "label": "100 squares, 5 of them yours"}, "options": [{"text": "A loan Northwind must pay back", "feedback": "A loan is a bond, and a bond gets paid back. A share is ownership: you own part of the bakery."}, {"text": "A slice of Northwind: 5% of the company", "feedback": "A share is a slice of the company. Five slices out of 100 is 5%."}, {"text": "A promise the price will rise", "feedback": "Nobody promises that. A share is ownership: the price can rise or fall, and you share in how the business does."}], "answer": 1, "idea": "share-is-ownership", "work": "5 shares ÷ 100 shares = 5% of the company."}}, {"chapter": "company-fundamentals", "challenge": {"lesson": 1, "q": "A company is split into 10,000,000 shares. You own 100,000 of them. What do you own?", "options": ["1% of the company", "A loan you get back with interest", "10% of the company"], "answer": 0, "why": "A share is a slice of ownership, not a loan. 100,000 slices out of 10,000,000 is one slice in every 100.", "work": "100,000 ÷ 10,000,000 = 1% of the company.", "idea": "share-is-ownership"}}], "market-value": [{"lesson": "what-a-share-really-is", "chapter": "company-fundamentals", "card": {"type": "exercise", "kind": "choice", "title": "Which company is bigger?", "q": "Acme’s shares cost $20. Beta’s shares cost $200. Which company is worth more?", "idea": "market-value", "visual": {"kind": "stats", "items": [{"label": "Acme", "value": "$20", "sub": "a share"}, {"label": "Beta", "value": "$200", "sub": "a share"}]}, "options": [{"text": "Beta: its share costs more", "feedback": "A pricey share doesn’t mean a big company. Market value is price times all the shares."}, {"text": "Acme: its share is cheaper", "feedback": "A cheap share doesn’t make a company big or small. Market value is price times all the shares, and you don’t know the share counts."}, {"text": "You can’t tell without the share count", "feedback": "Exactly. One share’s price says nothing about size. You need price × all the shares."}, {"text": "They’re the same size", "feedback": "Nothing here says they’re equal. Market value is price times all the shares, and the share counts can be very different."}], "answer": 2, "work": "Acme: 50M shares × $20 = $1B. Beta: 2M shares × $200 = $400M."}}], "price-vs-worth": [{"lesson": "what-a-share-really-is", "chapter": "company-fundamentals", "card": {"type": "check", "title": "Up 10%, same business", "q": "Northwind’s shares rose 10% today. Nothing in the business changed. Why can that happen?", "options": [{"text": "Its profit jumped 10% overnight", "feedback": "Profit doesn’t change in a day. Price is what buyers pay, and today buyers were keener than sellers."}, {"text": "More eager buyers than sellers", "feedback": "Price is what buyers pay. Today they were keener than sellers, so the price rose while the business stayed the same."}, {"text": "It printed more shares", "feedback": "More shares cut the company into more slices. That tends to push each share’s price down, not up."}, {"text": "Its debt was paid off", "feedback": "That would be a real change in the business. Here nothing changed: buyers were simply keener than sellers."}], "answer": 1, "idea": "price-vs-worth", "work": null}}], "profit-margin": [{"lesson": "revenue-profit-and-margins", "chapter": "company-fundamentals", "card": {"type": "call", "title": "Who keeps more?", "situation": "Acme sells $100M a year and keeps $20M as profit. Northwind sells $500M and keeps $25M. Which one keeps more of each dollar it sells?", "visual": {"kind": "barchart", "title": "Revenue and profit", "label": "Acme: $100M revenue, $20M profit. Northwind: $500M revenue, $25M profit", "series": [{"label": "Revenue", "tone": "blue"}, {"label": "Profit", "tone": "up"}], "groups": [{"label": "Acme", "values": [100, 20], "displays": ["$100M", "$20M"]}, {"label": "Northwind", "values": [500, 25], "displays": ["$500M", "$25M"]}]}, "options": [{"text": "Northwind: it sells five times more", "feedback": "Northwind sells more, but it keeps only 5 cents of each dollar. Acme keeps 20."}, {"text": "Acme: 20 cents of every dollar", "feedback": "Acme keeps four times more of each sale. That share is called the margin."}, {"text": "The same: both make a profit", "feedback": "Both make a profit, but not the same share of each sale. Acme keeps 20 cents a dollar, Northwind only 5."}], "answer": 1, "idea": "profit-margin", "work": "Acme: $20M ÷ $100M = 20%. Northwind: $25M ÷ $500M = 5%."}}, {"lesson": "revenue-profit-and-margins", "chapter": "company-fundamentals", "card": {"type": "exercise", "kind": "choice", "title": "Work out the margin", "q": "Northwind sold $200M last year and made $30M profit. What’s its margin?", "idea": "profit-margin", "visual": {"kind": "fields", "items": [{"label": "Revenue", "value": "$200M", "tone": "blue"}, {"label": "Profit", "value": "$30M", "tone": "up"}]}, "options": [{"text": "15%", "feedback": "Profit ÷ revenue: Northwind keeps 15 cents of every dollar it sells."}, {"text": "30%", "feedback": "$30M is the profit, not the margin. Divide it by the revenue."}, {"text": "6.7%", "feedback": "That’s revenue ÷ profit, upside down. Margin is profit ÷ revenue."}, {"text": "85%", "feedback": "85% is the part of each dollar that went on costs. The margin is the part the company keeps."}], "answer": 0, "work": "$30M ÷ $200M = 0.15 = 15%."}}, {"chapter": "company-fundamentals", "challenge": {"lesson": 2, "q": "Acme’s revenue grew from $80M to $100M. Profit stayed at $8M. What happened to its margin?", "options": ["It rose: sales grew", "It stayed at 10%", "It fell from 10% to 8%"], "answer": 2, "why": "Margin is profit ÷ revenue. The same profit on more sales means each dollar keeps less.", "work": "Before: $8M ÷ $80M = 10%. Now: $8M ÷ $100M = 8%.", "idea": "profit-margin", "visual": {"kind": "barchart", "title": "Acme · yearly", "label": "Revenue $80M then $100M; profit $8M both years", "series": [{"label": "Revenue", "tone": "blue"}, {"label": "Profit", "tone": "gold"}], "groups": [{"label": "Last year", "values": [80, 8], "displays": ["$80M", "$8M"]}, {"label": "This year", "values": [100, 8], "displays": ["$100M", "$8M"]}]}}}], "shrinking-margin": [{"lesson": "revenue-profit-and-margins", "chapter": "company-fundamentals", "card": {"type": "check", "title": "Fast growth, thin margin", "q": "Acme’s sales grew 30% this year, but its margin fell from 18% to 9%. What should you think?", "options": [{"text": "Great year: sales are what count", "feedback": "Sales grew, but the margin halved. Each dollar of sales now keeps half as much profit."}, {"text": "A warning: each sale earns much less", "feedback": "The margin halved, so each dollar of sales keeps half as much profit. Growth like that is worth a closer look."}, {"text": "Margins don’t matter for big firms", "feedback": "Margins matter for every company. A falling margin means each sale earns less, whatever the size."}, {"text": "The company is about to go bust", "feedback": "One weaker year doesn’t mean bust. It’s a warning to watch, not a verdict."}], "answer": 1, "idea": "shrinking-margin", "work": null}}], "pe-ratio": [{"lesson": "earnings-per-share-and-the-pe", "chapter": "company-fundamentals", "card": {"type": "call", "title": "Same price, different bet", "situation": "Acme and Northwind both trade at $50 a share. Acme earns $5 a share each year. Northwind earns $1. Which one are buyers expecting more growth from?", "visual": {"kind": "stats", "items": [{"label": "Acme", "value": "$50", "sub": "earns $5 a share"}, {"label": "Northwind", "value": "$50", "sub": "earns $1 a share"}]}, "options": [{"text": "Acme: it earns more per share", "feedback": "Acme earns more today, so buyers pay only 10 years of its profit. High hopes show up as a high price for each $1 of profit."}, {"text": "Northwind: they pay $50 for $1 of profit", "feedback": "Buyers pay 50 years of today’s profit for Northwind. They expect big growth."}, {"text": "Neither: same price, same hopes", "feedback": "Same price, very different profit. Paying $50 for $1 of profit only makes sense if buyers expect it to grow a lot."}], "answer": 1, "idea": "pe-ratio", "work": "Acme: $50 ÷ $5 = P/E 10. Northwind: $50 ÷ $1 = P/E 50."}}, {"chapter": "company-fundamentals", "challenge": {"lesson": 3, "q": "Northwind trades at $60 a share. Its EPS is $3. What is its P/E, and what does it mean?", "options": ["180: it’s far too expensive", "20: buyers pay $20 for each $1 of yearly profit", "3: it keeps 3% of its sales"], "answer": 1, "why": "P/E is price ÷ EPS: how many dollars buyers pay for $1 of yearly profit. It isn’t a verdict and it isn’t a margin.", "work": "$60 ÷ $3 = P/E 20.", "idea": "pe-ratio"}}], "eps-and-pe": [{"lesson": "earnings-per-share-and-the-pe", "chapter": "company-fundamentals", "card": {"type": "exercise", "kind": "choice", "title": "Find the P/E", "q": "Acme made $20M profit and has 10M shares. The share price is $40. What’s its P/E?", "idea": "eps-and-pe", "visual": {"kind": "rows", "rows": [{"label": "Profit", "value": "$20M"}, {"label": "Shares", "value": "10M"}, {"label": "Price", "value": "$40"}]}, "options": [{"text": "2", "feedback": "2 is the EPS, $2 a share. The P/E divides the price by it."}, {"text": "20", "feedback": "First EPS: $2 a share. Then the price ÷ EPS: buyers pay $20 for each $1 of yearly profit."}, {"text": "0.5", "feedback": "That divides the wrong numbers. First EPS = profit ÷ shares, then P/E = price ÷ EPS."}, {"text": "800", "feedback": "That multiplies the price by the profit. First EPS = profit ÷ shares, then P/E = price ÷ EPS."}], "answer": 1, "work": "$20M ÷ 10M = $2 EPS. $40 ÷ $2 = P/E 20."}}], "high-pe-expectations": [{"lesson": "earnings-per-share-and-the-pe", "chapter": "company-fundamentals", "card": {"type": "check", "title": "A P/E of 80", "q": "Beta’s P/E is 80. Similar firms sit near 20. What does that tell you?", "options": [{"text": "It’s overpriced: avoid it", "feedback": "A high P/E isn’t a verdict. It shows big expectations, which is also a risk if growth disappoints."}, {"text": "Buyers expect much faster profit growth", "feedback": "Buyers pay $80 for each $1 of profit, four times what similar firms get. That’s big hopes, and a risk if growth disappoints."}, {"text": "It keeps 80% of its sales", "feedback": "That would be a margin. The P/E is price ÷ EPS: dollars paid for $1 of yearly profit."}, {"text": "It will rise 80% this year", "feedback": "A P/E doesn’t forecast the price. It shows how much buyers pay for $1 of profit today."}], "answer": 1, "idea": "high-pe-expectations", "work": null}}], "profit-vs-cash": [{"lesson": "debt-and-cash-flow", "chapter": "company-fundamentals", "card": {"type": "call", "title": "Profit, but less cash?", "situation": "Acme reports a $10M profit this year. Yet its bank balance fell by $5M. How can both be true?", "visual": {"kind": "stats", "items": [{"label": "Profit", "value": "+$10M", "sub": "on paper", "tone": "up"}, {"label": "Cash in the bank", "value": "−$5M", "sub": "this year", "tone": "down"}]}, "options": [{"text": "The numbers must be wrong", "feedback": "Both can be right. A sale counts as profit when it’s made, but the cash arrives only when the customer pays."}, {"text": "Customers haven’t paid yet: profit isn’t cash", "feedback": "Profit counts the sale. Cash waits for the payment."}, {"text": "Profit and cash are always equal", "feedback": "They often aren’t. Profit counts a sale when it’s made; the cash arrives only when the customer pays."}], "answer": 1, "idea": "profit-vs-cash", "work": "Acme booked $40M of sales but collected only $25M. The rest is still owed by customers."}}, {"lesson": "debt-and-cash-flow", "chapter": "company-fundamentals", "card": {"type": "check", "title": "Same profit, different cash", "q": "Both firms report a $10M profit. Acme turned it into $9M of cash. Northwind’s cash flow was −$2M. Which is on safer ground?", "options": [{"text": "Northwind: same profit", "feedback": "Same profit on paper, but Northwind’s cash went out, not in. Bills are paid in cash."}, {"text": "Acme: its profit arrived as cash", "feedback": "Bills are paid in cash, and Acme’s profit showed up in the bank as $9M. Northwind’s didn’t."}, {"text": "Same: profit is all that matters", "feedback": "Bills are paid in cash. Acme’s profit showed up in the bank. Northwind’s didn’t."}, {"text": "You can’t compare them", "feedback": "You can: compare how much of each profit arrived as cash. Acme +$9M, Northwind −$2M."}], "answer": 1, "idea": "profit-vs-cash", "work": null}}], "debt-in-bad-year": [{"lesson": "debt-and-cash-flow", "chapter": "company-fundamentals", "card": {"type": "exercise", "kind": "choice", "title": "A bad year with debt", "q": "Northwind usually earns $15M before interest and pays $12M interest a year. This year it earns only $9M before interest. What’s left?", "idea": "debt-in-bad-year", "visual": {"kind": "stats", "items": [{"label": "Earned", "value": "$9M", "sub": "before interest", "tone": "up"}, {"label": "Interest", "value": "$12M", "sub": "every year", "tone": "down"}]}, "options": [{"text": "A $3M profit", "feedback": "$3M profit is a normal year. Interest doesn’t shrink when earnings do."}, {"text": "A $3M loss", "feedback": "Interest stays at $12M even in a bad year, and $9M of earnings can’t cover it."}, {"text": "$9M: interest drops in bad years", "feedback": "Interest is set by the loan. It doesn’t shrink when earnings fall."}, {"text": "$21M profit", "feedback": "Interest is a cost, so you take it away from earnings, not add it."}], "answer": 1, "work": "$9M − $12M interest = −$3M. A normal year: $15M − $12M = $3M."}}, {"chapter": "company-fundamentals", "challenge": {"lesson": 4, "q": "Both firms earn $10M before interest. Acme has no debt. Northwind pays $9M interest a year. Next year both earn only $5M before interest. Who is in trouble?", "options": ["Acme: it has no loan to fall back on", "Northwind: its interest is bigger than its earnings", "Neither: both still earn $5M"], "answer": 1, "why": "Interest costs the same in a bad year. Northwind’s $9M bill is bigger than its $5M of earnings. Acme keeps all of its $5M.", "work": "Northwind: $5M − $9M = −$4M. Acme: $5M − $0 = $5M.", "idea": "debt-in-bad-year"}}], "beat-or-miss": [{"lesson": "reading-an-earnings-report-in-5-minutes", "chapter": "company-fundamentals", "card": {"type": "call", "title": "Record profit, price falls", "situation": "Acme reports record sales and record profit. The share price falls 8% the next morning. Why?", "visual": {"kind": "table", "title": "Acme · Q3", "label": "Acme Q3: revenue $500M vs $520M expected, EPS $1.10 vs $1.20, both misses", "cols": [{"label": "Line"}, {"label": "Reported"}, {"label": "Expected"}, {"label": "", "w": 0.8}], "rows": [{"cells": ["Revenue", {"text": "$500M", "strong": true}, {"text": "$520M", "tone": "muted"}, {"text": "Miss", "badge": true, "tone": "down"}]}, {"cells": ["EPS", {"text": "$1.10", "strong": true}, {"text": "$1.20", "tone": "muted"}, {"text": "Miss", "badge": true, "tone": "down"}]}], "aside": "−8%", "asideTone": "down"}, "options": [{"text": "The market made a mistake", "feedback": "The price already counted on a great quarter. It fell because the results came in below what was expected."}, {"text": "Investors expected even more", "feedback": "Price reacts to surprises, not results. A record that’s below hopes is a disappointment."}, {"text": "Record profits are bad news", "feedback": "Record profits are good news. The price fell because they came in below what investors expected."}], "answer": 1, "idea": "beat-or-miss", "work": "Expected EPS $1.20, reported $1.10. A record, but $0.10 short."}}, {"lesson": "reading-an-earnings-report-in-5-minutes", "chapter": "company-fundamentals", "card": {"type": "check", "title": "Record, but…", "q": "Analysts expected EPS of $2.00. Acme reports $1.90, its best ever. How will the market see it?", "options": [{"text": "A beat: it’s a record", "feedback": "A record alone doesn’t move the price. Expectations do, and $1.90 is below $2.00."}, {"text": "A miss: $0.10 below expected", "feedback": "Expectations set the bar. $1.90 is $0.10 short of the $2.00 expected, record or not."}, {"text": "No surprise: profit grew", "feedback": "Growth isn’t the test. The market compares with what was expected, and $1.90 is below $2.00."}, {"text": "A beat: EPS is positive", "feedback": "Positive isn’t the bar. A beat means above what was expected, and $1.90 is below $2.00."}], "answer": 1, "idea": "beat-or-miss", "work": null}}], "guidance-matters": [{"lesson": "reading-an-earnings-report-in-5-minutes", "chapter": "company-fundamentals", "card": {"type": "exercise", "kind": "choice", "title": "Find the surprise", "q": "Acme’s shares fell 12% after this report. Which line most likely caused it?", "idea": "guidance-matters", "visual": {"kind": "table", "title": "Acme · Q4", "label": "Acme Q4: revenue beat, EPS in line, guidance $1.1B vs $1.3B expected", "cols": [{"label": "Line"}, {"label": "Reported"}, {"label": "Expected"}, {"label": "", "w": 0.8}], "rows": [{"cells": ["Revenue", {"text": "$300M", "strong": true}, {"text": "$290M", "tone": "muted"}, {"text": "Beat", "badge": true, "tone": "up"}]}, {"cells": ["EPS", {"text": "$1.50", "strong": true}, {"text": "$1.50", "tone": "muted"}, {"text": "In line", "badge": true, "tone": "muted"}]}, {"cells": ["Guidance", {"text": "$1.1B", "strong": true}, {"text": "$1.3B", "tone": "muted"}, {"text": "Below", "badge": true, "tone": "down"}]}]}, "options": [{"text": "Revenue", "feedback": "Revenue beat the forecast, $300M vs $290M. A beat doesn’t usually sink a stock."}, {"text": "EPS", "feedback": "EPS matched what was expected, so it was no surprise. Guidance was the shock."}, {"text": "Guidance", "feedback": "The outlook for next year came in well below what was expected. That was the shock."}, {"text": "None: it’s random", "feedback": "A 12% move on results day has a reason. Look for the line that missed what was expected."}], "answer": 2, "work": "Guidance $1.1B vs $1.3B expected = $200M short."}}, {"chapter": "company-fundamentals", "challenge": {"lesson": 5, "q": "Analysts expected EPS of $0.80. Acme reports $0.90, but cuts its guidance for next year. The price falls. Why?", "options": ["The EPS beat was too small", "The market weighs the future: the guidance cut", "Prices always fall after earnings"], "answer": 1, "why": "EPS beat what was expected, but the price moves most on what’s next. A guidance cut says next year looks weaker.", "work": "Reported $0.90 − expected $0.80 = a $0.10 beat. Guidance: cut.", "idea": "guidance-matters", "visual": {"kind": "barchart", "title": "Acme · quarterly EPS", "aside": "Guidance ↓", "asideTone": "down", "label": "Expected EPS $0.80, reported $0.90; guidance cut", "groups": [{"label": "Expected", "values": [0.8], "displays": ["$0.80"], "tones": ["muted"]}, {"label": "Reported", "values": [0.9], "displays": ["$0.90"], "tones": ["up"]}]}}}], "rate-surprise-moves-stocks": [{"lesson": "interest-rates-move-everything", "chapter": "markets-economy", "card": {"type": "call", "pose": "point", "title": "A surprise hike", "situation": "Traders expected the central bank to hold rates at 4%. It raised them to 4.5%. What do stocks often do that day?", "visual": {"kind": "rows", "rows": [{"label": "Expected", "value": "Hold at 4.00%"}, {"label": "Actual", "value": "Raise to 4.50%", "tone": "gold", "strong": true}, {"label": "Surprise", "value": "+0.50 points", "tone": "down", "strong": true}]}, "options": [{"text": "Rise: higher rates mean a strong economy", "feedback": "A strong economy helps, but a surprise hike makes loans dearer and cash more attractive. Stocks often fall on the day."}, {"text": "Fall: money just got costlier than expected", "feedback": "A surprise hike makes borrowing costlier and cash more attractive. Many investors pay less for stocks."}, {"text": "Nothing: rates only matter to banks", "feedback": "Rates reach everyone: loans, savings and what investors will pay for stocks. A surprise hike often hits stocks on the day."}], "answer": 1, "idea": "rate-surprise-moves-stocks", "work": "Expected 4.00%. Actual 4.50%. A 0.50-point surprise."}}, {"chapter": "markets-economy", "challenge": {"lesson": 1, "q": "Traders expected a rate cut of 0.25 points. The central bank cuts 0.50 points. How do stocks often react?", "options": ["Often up: money got cheaper than expected", "Often down: lower rates make cash pay more", "Little move: a cut was expected anyway"], "answer": 0, "why": "The surprise moves prices. A cut twice the size traders expected makes money cheaper than they priced in, so stocks often rise.", "work": "Expected cut 0.25 points. Actual cut 0.50 points. A 0.25-point surprise.", "idea": "rate-surprise-moves-stocks"}}], "cash-competes-with-stocks": [{"lesson": "interest-rates-move-everything", "chapter": "markets-economy", "card": {"type": "exercise", "kind": "choice", "title": "Cash fights back", "q": "Your savings account paid 1% a year. After rate rises it pays 5%, with no stock risk. Why might some money leave stocks?", "idea": "cash-competes-with-stocks", "visual": {"kind": "barchart", "title": "Savings rate", "label": "Savings rate: 1% before, 5% now", "groups": [{"label": "Before", "values": [1], "displays": ["1%"], "tones": ["muted"]}, {"label": "Now", "values": [5], "displays": ["5%"], "tones": ["up"]}]}, "options": [{"text": "Cash pays well, with less risk", "feedback": "At 5% with no stock risk, safe cash now competes with stocks. Some investors move money across."}, {"text": "Stocks stop paying dividends", "feedback": "Companies don’t stop paying dividends because rates rose. What changed is that cash now pays more, with less risk."}, {"text": "Cash beats stocks every year", "feedback": "Stocks can earn more over time, but with risk. At 5%, safe cash is a fair choice."}, {"text": "Banks force savers to sell", "feedback": "Nobody forces savers to sell. They choose to, because cash now pays well with less risk."}], "answer": 0, "work": "$10,000: $100 a year, now $500."}}], "rates-hit-growth-stocks": [{"lesson": "interest-rates-move-everything", "chapter": "markets-economy", "card": {"type": "check", "title": "Who feels it most?", "q": "Rates rise. Why do fast-growing tech stocks often fall the most?", "options": [{"text": "Much of their value rests on profits years away", "feedback": "Fast growers’ value rests on profits years away, and higher rates shrink what those far-off profits are worth today."}, {"text": "They pay the biggest dividends", "feedback": "Fast growers usually pay small dividends or none. Their value rests on profits years away."}, {"text": "Higher rates cut their sales the same day", "feedback": "Sales don’t change overnight. Higher rates shrink what far-off profits are worth today, and fast growers rely on those most."}, {"text": "Tech companies can’t borrow at all", "feedback": "Tech companies can still borrow; it just costs more. The bigger hit is to what far-off profits are worth today."}], "answer": 0, "idea": "rates-hit-growth-stocks", "work": null}}], "inflation-erodes-savings": [{"lesson": "inflation-and-your-money", "chapter": "markets-economy", "card": {"type": "call", "pose": "think", "title": "Richer or poorer?", "situation": "Your savings earned 3% this year. Prices in the shops rose 5%. Did you get richer?", "visual": {"kind": "barchart", "title": "This year", "label": "Your savings grew 3%, prices rose 5%", "groups": [{"label": "Your savings", "values": [3], "displays": ["+3%"], "tones": ["up"]}, {"label": "Prices", "values": [5], "displays": ["+5%"], "tones": ["down"]}]}, "options": [{"text": "Yes: you have 3% more money", "feedback": "You have more dollars, but each one buys less. Prices rose faster than your savings."}, {"text": "No: you can buy about 2% less", "feedback": "More dollars, less stuff. Your real return was about −2%."}, {"text": "No change: it evens out", "feedback": "It doesn’t even out: prices rose 5% and your savings only 3%. You can buy about 2% less."}], "answer": 1, "idea": "inflation-erodes-savings", "work": "$10,000 grew to $10,300. Goods that cost $10,000 now cost $10,500. Real return ≈ 3% − 5% = −2%."}}], "real-return-math": [{"lesson": "inflation-and-your-money", "chapter": "markets-economy", "card": {"type": "exercise", "kind": "choice", "title": "Find the real return", "q": "You hold a bond paying 6% a year. Inflation is 4%. What is your real return?", "idea": "real-return-math", "visual": {"kind": "barchart", "title": "This year", "label": "Bond pays 6%, inflation is 4%, real return unknown", "groups": [{"label": "Bond", "values": [6], "displays": ["+6%"], "tones": ["up"]}, {"label": "Inflation", "values": [4], "displays": ["+4%"], "tones": ["down"]}, {"label": "Real", "values": [0.15], "displays": ["?"], "tones": ["gold"]}]}, "options": [{"text": "10%", "feedback": "Inflation is taken away, not added. Real return is what’s left after prices rise."}, {"text": "6%", "feedback": "6% is what the bond pays before inflation. Take inflation away to find what you really earn."}, {"text": "2%", "feedback": "The bond pays 6% and prices rise 4%, so your buying power grows about 2% a year."}, {"text": "−2%", "feedback": "That takes away the wrong way round. The bond pays more than inflation, so the real return is positive."}], "answer": 2, "work": "6% − 4% = 2%."}}, {"chapter": "markets-economy", "challenge": {"lesson": 2, "q": "Your savings pay 2% a year. Inflation is 6%. What is your real return?", "visual": {"kind": "hbars", "title": "This year", "aside": "per year", "label": "Your savings earn 2%, inflation is 6%", "rows": [{"label": "Your savings", "value": 2, "display": "2%", "tone": "up"}, {"label": "Inflation", "value": 6, "display": "6%", "tone": "down"}]}, "options": ["+8%", "+2%", "−4%"], "answer": 2, "why": "Inflation is taken away, not added. You earn 2%, but prices rise 6%.", "work": "2% − 6% ≈ −4%. $10,000 earns $200, but the same goods cost $600 more.", "idea": "real-return-math"}}], "hot-cpi-higher-rates": [{"lesson": "inflation-and-your-money", "chapter": "markets-economy", "card": {"type": "check", "title": "Hotter than expected", "q": "Markets expected inflation of 3%. The CPI report shows 4%. What might traders now expect from the central bank?", "options": [{"text": "Faster rate cuts", "feedback": "Hot inflation is a reason to keep rates high, not to cut them."}, {"text": "Rates kept higher for longer", "feedback": "Hot inflation gives the central bank a reason to keep rates high, so traders push back their hopes of cuts."}, {"text": "Prices to fall at once", "feedback": "One hot report doesn’t make prices fall. It shows they’re still rising fast."}, {"text": "Nothing: CPI doesn’t affect rates", "feedback": "CPI is one of the main numbers central banks watch when they set rates."}], "answer": 1, "idea": "hot-cpi-higher-rates", "work": null}}], "event-risk-size": [{"lesson": "the-economic-calendar", "chapter": "markets-economy", "card": {"type": "call", "pose": "worried", "title": "Big trade, big day", "situation": "You hold a trade four times your normal size. The monthly jobs report comes out tomorrow at 8:30. What’s the risk?", "visual": {"kind": "calendar", "items": [{"day": "Fri", "time": "8:30", "title": "Jobs report", "impact": "high", "on": true}]}, "options": [{"text": "Little: one report rarely moves much", "feedback": "Big reports often move markets within seconds, and nobody knows which way."}, {"text": "Price can jump sharply either way at 8:30", "feedback": "Nobody knows the number in advance, so price can jump either way. Your size decides how much it hurts."}, {"text": "None: trading pauses until it’s out", "feedback": "Trading doesn’t pause. Price can jump the second the number lands, and your size decides how much it hurts."}], "answer": 1, "idea": "event-risk-size", "work": "If the market jumps 1% against you, you lose four times what you would on your normal size."}}], "high-impact-releases": [{"lesson": "the-economic-calendar", "chapter": "markets-economy", "card": {"type": "exercise", "kind": "choice", "title": "Spot the risky day", "q": "You trade short-term. Which day this week carries the most event risk?", "idea": "high-impact-releases", "visual": {"kind": "calendar", "title": "This week", "items": [{"day": "Mon", "time": "10:00", "title": "Factory orders", "impact": "low"}, {"day": "Tue", "time": "10:00", "title": "Consumer confidence", "impact": "medium"}, {"day": "Wed", "time": "8:30", "title": "CPI inflation", "impact": "high"}, {"day": "Thu", "time": "8:30", "title": "Jobless claims", "impact": "medium"}]}, "options": [{"text": "Monday", "feedback": "Factory orders is a low-impact release. Look for the release marked high."}, {"text": "Tuesday", "feedback": "Consumer confidence is medium impact. Another day ": "gold"}]}, "options": [{"text": "Luxury brands and travel", "feedback": "Luxury and travel are often the first things people cut when money is tight. A new bag or a holiday can wait."}, {"text": "Consumer staples: food, soap, toothpaste", "feedback": "People keep buying the basics, so staples’ sales usually swing less."}, {"text": "Fast-growing tech", "feedback": "Tech can grow in any economy, but many buyers delay big purchases when money is tight."}], "answer": 1, "idea": "staples-hold-up", "work": "People still buy toothpaste in a slowdown. A new phone or a holiday can wait."}}], "oil-moves-energy": [{"lesson": "sectors-and-the-cycle", "chapter": "markets-economy", "card": {"type": "exercise", "kind": "choice", "title": "Oil jumps", "q": "The oil price rises 20% in a month. Which sector feels it most directly?", "idea": "oil-moves-energy", "visual": {"kind": "series", "title": "Oil · 1 month", "aside": "+20%", "ends": false, "height": 90, "label": "Oil rises from $70 to $84 a barrel in a month", "series": [{"values": [70, 70.8, 70.4, 71.6, 73.2, 72.8, 75.6, 78.4, 80.6, 82.0, 84], "tone": "gold", "area": true}], "points": [{"i": 0, "label": "$70", "tone": "muted"}, {"i": 10, "label": "$84", "tone": "gold", "pos": "below"}]}, "options": [{"text": "Energy", "feedback": "Oil and gas companies sell what just got 20% dearer, so their sales move directly with the oil price."}, {"text": "Utilities", "feedback": "Utilities may pay a little more for fuel, but oil and gas companies’ sales move directly with the oil price."}, {"text": "Consumer staples", "feedback": "Staples may face slightly higher transport costs. Oil and gas companies’ sales move directly with the oil price."}, {"text": "Tech", "feedback": "Tech may feel slightly higher costs. Oil and gas companies’ sales move directly with the oil price."}], "answer": 0, "work": "$70 to $84 a barrel: +20% on every barrel they sell."}}], "rates-pressure-utilities": [{"lesson": "sectors-and-the-cycle", "chapter": "markets-economy", "card": {"type": "check", "title": "Rates up, utilities down?", "q": "Utilities borrow a lot, and many people buy them for steady dividends. When rates rise fast, they often…", "options": [{"text": "Come under pressure", "feedback": "Their loans cost more, and bonds now pay more, so their steady dividends look less special."}, {"text": "Rise: higher rates mean higher dividends", "feedback": "Higher rates don’t raise a utility’s dividend. They raise its borrowing costs and make bonds a rival for income."}, {"text": "Aren’t affected at all", "feedback": "Higher rates raise their borrowing costs, and bonds now pay more, so their steady dividends look less special."}, {"text": "Move only with oil prices", "feedback": "Oil matters most to energy companies. Utilities are sensitive to rates because they borrow a lot."}], "answer": 0, "idea": "rates-pressure-utilities", "work": null}}], "priced-in": [{"lesson": "news-vs-noise", "chapter": "markets-economy", "card": {"type": "call", "pose": "detective", "title": "Big news, small move", "situation": "Traders had expected a rate cut for weeks. Today it came. Stocks rose just 0.1%. Why so little?", "visual": {"kind": "stack", "items": [{"kind": "headline", "text": "Central bank cuts rates"}, {"kind": "rows", "rows": [{"label": "Expected", "value": "Cut 0.25 pts · for weeks", "strong": true}, {"label": "Actual", "value": "Cut 0.25 pts", "strong": true}, {"label": "Stocks", "value": "+0.1%", "tone": "muted"}]}]}, "options": [{"text": "Traders missed the news", "feedback": "The news hit every screen in seconds. Traders had already bought on the expectation."}, {"text": "It was already priced in", "feedback": "Prices already reflected the cut. With no surprise, there was little left to move."}, {"text": "Rate cuts are bad for stocks", "feedback": "Cuts usually help stocks. The move was small because traders had expected this cut for weeks."}], "answer": 1, "idea": "priced-in", "work": "Expected cut 0.25 points. Actual ack": "News that’s new, surprising and lasting can change the outlook. Most of the rest is noise you can let pass."}, {"text": "Do the opposite of every headline", "feedback": "Doing the opposite is still trading every headline. Most news is noise: filter it first."}, {"text": "Turn off your stops for the day", "feedback": "Stops matter most on busy news days, when price can jump. Keep them on."}], "answer": 1, "idea": "headline-filter", "work": null}}], "diversify-cuts-the-hit": [{"lesson": "eggs-in-one-basket", "chapter": "portfolio-management", "card": {"type": "call", "pose": "point", "title": "One bad day", "situation": "Ben puts $10,000 into one company. Max puts $1,000 into each of 10 companies, including Ben’s. That company falls 50%. How much does each lose?", "visual": {"kind": "split", "label": "Ben holds one stock; Max holds ten equal stocks", "rows": [{"label": "Ben", "aside": "1 stock", "segments": [{"value": 1, "tone": "up", "label": "1 stock · 100%"}]}, {"label": "Max", "aside": "10 stocks", "segments": [{"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}]}]}, "options": [{"text": "Both lose $5,000", "feedback": "The company fell 50% for both. But Max only had a tenth of his money in it."}, {"text": "Ben loses $5,000, Max loses $500", "feedback": "Same crash, a tenth of the damage. That’s diversification."}, {"text": "Max loses more: he owns more stocks", "feedback": "Owning more stocks doesn’t add to this loss. Only one company fell, and Max had just $1,000 in it."}], "answer": 1, "idea": "diversify-cuts-the-hit", "work": "Ben: $10,000 × 50% = $5,000. Max: $1,000 × 50% = $500, just 5% of his money."}}, {"chapter": "portfolio-management", "challenge": {"lesson": 1, "q": "You have $20,000: $10,000 in one stock and $1,000 in each of 10 others. The big holding falls 40%. How much do you lose?", "options": ["$4,000: a fifth of all your money", "$2,000: 10% of your money", "$8,000: 40% of everything"], "answer": 0, "why": "Only the big holding fell, but it was half your money. Its 40% fall costs $4,000, a fifth of your $20,000.", "work": "$10,000 × 40% = $4,000. $4,000 ÷ $20,000 = 20%, a fifth.", "idea": "diversify-cuts-the-hit"}}], "one-holding-loss": [{"lesson": "eggs-in-one-basket", "chapter": "portfolio-management", "card": {"type": "exercise", "kind": "choice", "title": "Count the damage", "q": "You own 5 stocks, $2,000 in each: $10,000 in all. One of them falls 50%. How much do you lose?", "idea": "one-holding-loss", "visual": {"kind": "split", "label": "Five equal holdings of $2,000; one falls", "rows": [{"label": "Your 5 stocks", "aside": "$2,000 each", "segments": [{"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "up"}, {"value": 1, "tone": "down"}]}]}, "options": [{"text": "$5,000", "feedback": "Only one holding fell, and it was a fifth of your money."}, {"text": "$1,000", "feedback": "One holding of $2,000 lost half. The other four didn’t move, so the damage stays small."}, {"text": "$2,000", "feedback": "$2,000 is the whole holding. It fell by half, not to zero."}, {"text": "$500", "feedback": "That’s too small. Take half of the $2,000 that fell."}], "answer": 1, "work": "$2,000 × 50% = $1,000, or 10% of $10,000."}}], "diversification-protects-from": [{"lesson": "eggs-in-one-basket", "chapter": "portfolio-management", "card": {"type": "check", "title": "What it protects", "q": "Diversification protects you most from…", "options": [{"text": "Bad news at one company", "feedback": "Spreading out shrinks the hit from one company. Bad news there touches only a small part of your money."}, {"text": "A crash in the whole market", "feedback": "When the whole market falls, most stocks fall with it. Spreading across stocks can’t stop that."}, {"text": "Every possible loss", "feedback": "Spreading out shrinks the hit from one company. When the whole market falls, most stocks fall with it."}, {"text": "Paying fees", "feedback": "Diversifying doesn’t cut fees. It limits how much one bad pick can hurt you."}], "answer": 0, "idea": "diversification-protects-from", "work": null}}], "same-industry-one-bet": [{"lesson": "correlation", "chapter": "portfolio-management", "card": {"type": "call", "pose": "point", "title": "Five stocks, one bet?", "situation": "You own 5 stocks. All five are big tech companies. Are you well diversified?", "visual": {"kind": "split", "label": "Five holdings, all in tech", "legend": [{"label": "Tech", "tone": "blue"}], "rows": [{"label": "Your 5 stocks", "aside": "all tech", "segments": [{"value": 1, "tone": "blue"}, {"value": 1, "tone": "blue"}, {"value": 1, "tone": "blue"}, {"value": 1, "tone": "blue"}, {"value": 1, "tone": "blue"}]}]}, "options": [{"text": "Yes: 5 stocks is plenty", "feedback": "The count looks good, but the same news hits all five. When tech falls, they fall together."}, {"text": "Not really: they tend to move together", "feedback": "Same industry, same news, same moves. You own one bet five times."}, {"text": "Yes: big companies don’t fall", "feedback": "Big companies fall too. And when tech has a bad month, all five big tech names usually fall at once."}], "answer": 1, "idea": "same-industry-one-bet", "work": "Tech sell-off: all five fall around 20% together. Five stocks, one bet."}}], "pair-that-spreads-risk": [{"lesson": "correlation", "chapter": "portfolio-management", "card": {"type": "exercise", "kind": "choice", "title": "Pick the best pair", "q": "Which pair is most likely to spread your risk?", "idea": "pair-that-spreads-risk", "options": [{"text": "Two big bank stocks", "feedback": "Two banks face the same rates, rules and news. Stocks and bonds are different asset types that often move differently."}, {"text": "Two oil companies", "feedback": "T  more stocks", "feedback": "That pushes you even further from 60/40. Stocks are already above target."}], "answer": 1, "idea": "rebalance-trim-winners", "work": "Total $11,000. 60% = $6,600 in stocks. Sell $1,400 of stocks, buy $1,400 of bonds."}}, {"chapter": "portfolio-management", "challenge": {"lesson": 4, "q": "Your target is 70% stocks, 30% bonds. After a bad year you have $6,000 in stocks and $4,000 in bonds. What brings you back to target?", "options": ["Move $1,000 from bonds into stocks", "Sell stocks: they’re falling", "Wait until stocks recover"], "answer": 0, "why": "Rebalancing tops up what lagged. Stocks are now below target, so move money from bonds into stocks.", "work": "Total $10,000. 70% = $7,000 in stocks. $7,000 − $6,000 = $1,000 to move from bonds.", "visual": {"kind": "split", "label": "Target 70% stocks, 30% bonds; after a bad year", "legend": [{"label": "Stocks", "tone": "up"}, {"label": "Bonds", "tone": "blue"}], "rows": [{"label": "Target", "segments": [{"value": 70, "label": "70%", "tone": "up"}, {"value": 30, "label": "30%", "tone": "blue"}]}, {"label": "After a bad year", "segments": [{"value": 60, "label": "$6,000 · 60%", "tone": "up"}, {"value": 40, "label": "$4,000 · 40%", "tone": "blue"}]}]}, "idea": "rebalance-trim-winners"}}], "rebalance-amount": [{"lesson": "rebalancing", "chapter": "portfolio-management", "card": {"type": "exercise", "kind": "choice", "title": "How much to sell?", "q": "Your target is 50% stocks, 50% bonds. Now you have $14,000 in stocks and $6,000 in bonds. How much stock do you sell?", "idea": "rebalance-amount", "visual": {"kind": "split", "label": "$20,000 now: 70% stocks, 30% bonds; target 50/50", "rows": [{"label": "$20,000 now", "aside": "target 50/50", "segments": [{"value": 70, "tone": "up", "label": "Stocks 70%"}, {"value": 30, "tone": "blue", "label": "30%"}]}]}, "options": [{"text": "$4,000", "feedback": "Half of the whole $20,000 is $10,000. You hold $14,000, so the extra comes off."}, {"text": "$7,000", "feedback": "Half of $14,000 isn’t the target. Half of the whole $20,000 is."}, {"text": "$2,000", "feedback": "That only gets stocks to $12,000, still 60%. The target is half of the whole $20,000."}, {"text": "$14,000", "feedback": "That sells every stock. The target is 50% stocks, not zero."}], "answer": 0, "work": "50% × $20,000 = $10,000. $14,000 − $10,000 = $4,000 to sell."}}], "rebalance-how-often": [{"lesson": "rebalancing", "chapter": "portfolio-management", "card": {"type": "check", "title": "How often?", "q": "How often does a typical long-term investor rebalance?", "options": [{"text": "Every day", "feedback": "Daily rebalancing piles up costs and chases noise. Once or twice a year keeps the split close enough."}, {"text": "Once or twice a year", "feedback": "Once or twice a year keeps the split close enough without piling up costs."}, {"text": "Never", "feedback": "Without rebalancing the split keeps drifting, and your risk drifts with it."}, {"text": "Only after a crash", "feedback": "Drift comes from good years too. A set date, once or twice a year, catches both."}], "answer": 1, "idea": "rebalance-how-often", "work": null}}], "fees-compound": [{"lesson": "costs-that-compound", "chapter": "portfolio-management", "card": {"type": "call", "pose": "point", "title": "A small fee?", "situation": "Two funds hold the same stocks. Fund A charges 0.1% a year, Fund B 1%. You put $10,000 in for 20 years. Roughly how big is the gap at the end?", "visual": {"kind": "rows", "rows": [{"label": "Fund A · yearly fee", "value": "0.1%", "tone": "up", "strong": true}, {"label": "Fund B · yearly fee", "value": "1%", "tone": "down", "strong": true}]}, "options": [{"text": "About $1,800: 0.9% a year for 20 years", "feedback": "The fee is taken from a growing pot, and the money it takes stops growing too. So the gap compounds."}, {"text": "About $6,000", "feedback": "Fees compound like returns do, just in the wrong direction."}, {"text": "Almost nothing: 1% is tiny", "
