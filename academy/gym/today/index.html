<script type="application/json" id="ac-gym">{"ideas": {"bear-market-20-percent": [{"lesson": "bulls-vs-bears", "chapter": "how-markets-work", "card": {"type": "call", "pose": "point", "title": "Bear market, or a bad week?", "situation": "The market fell 5% this week. A headline shouts “Bear market!” Is it right?", "visual": {"kind": "line", "title": "Market index fell 5% this week", "tone": "down", "points": [100.0, 98.9, 99.3, 97.1, 97.7, 95.0], "drop": "−5%", "from": "100", "to": "95", "tag": {"label": "Headline", "text": "“Bear market is here!”"}, "label": "Line chart: the market index falls from 100 at Monday's open to 95 at Friday's close, down 5%"}, "options": [{"text": "Yes: prices are falling", "feedback": "Falling isn’t enough. A bear market is a fall of about 20% from the high. 5% is a normal dip."}, {"text": "Not yet: it needs a bigger fall", "feedback": "A bad week isn’t a bear market. That takes a fall of about 20% from the high."}, {"text": "No: it’s a bull market", "feedback": "A bull market is a rise of about 20% or more. This market fell 5%: a normal dip, not a bull market."}], "answer": 1, "idea": "bear-market-20-percent", "work": "100 → 95 = −5%. A bear market needs −20%: 100 → 80."}}, {"chapter": "how-markets-work", "challenge": {"lesson": 1, "q": "A stock fell from a high of $200 to $150 over four months. By the usual definition, is it in a bear market?", "options": ["Yes: it’s down 25% from the high", "No: it’s only down $50", "No: bear markets need a year"], "answer": 0, "why": "Use percent, not dollars: the $50 fall ÷ the $200 high = 25% down. That’s past the 20% line, so it’s a bear market. Time doesn’t decide it.", "idea": "bear-market-20-percent", "visual": {"kind": "series", "title": "Daily · 4 months", "height": 118, "series": [{"values": [182.0, 183.1, 184.8, 188.3, 191.0, 191.7, 193.6, 197.3, 200.0, 198.8, 195.3, 192.2, 188.0, 188.0, 190.7, 190.7, 193.0, 187.3, 182.8, 179.0, 176.0, 178.9, 179.4, 180.3, 180.0, 177.1, 170.2, 166.5, 163.0, 164.8, 166.5, 168.3, 168.0, 165.2, 157.2, 155.0, 150.0], "tone": "blue"}], "points": [{"i": 8, "label": "high $200", "tone": "gold", "pos": "above", "anchor": "middle"}, {"i": 36, "label": "$150", "tone": "down", "pos": "below", "anchor": "end"}], "label": "A stock falls from a high of $200 to $150 over four months"}}}], "bull-vs-bear": [{"lesson": "bulls-vs-bears", "chapter": "how-markets-work", "card": {"type": "exercise", "kind": "sort", "title": "Bull, bear or neither?", "q": "Drag each move into the right box. Work out the percent first.", "idea": "bull-vs-bear", "items": [{"text": "1,000 → 1,250", "sub": "From a low · over a year"}, {"text": "$50 → $38", "sub": "From a high · over 8 months"}], "given": [{"item": {"text": "100 → 95", "sub": "In one week"}, "bucket": "neither"}], "buckets": [{"id": "bull", "label": "Bull", "sub": "up 20% or more", "tone": "up", "icon": "up"}, {"id": "bear", "label": "Bear", "sub": "down 20% or more", "tone": "down", "icon": "down"}, {"id": "neither", "label": "Neither", "sub": "less than 20%", "tone": "muted", "icon": "flat"}], "solution": {"bull": ["1,000 → 1,250"], "bear": ["$50 → $38"], "neither": []}, "itemFeedback": {"1,000 → 1,250": "250 on 1,000 is a 25% rise from a low. That’s past the 20% line, so it’s a bull market.", "$50 → $38": "$12 off a $50 high is a 24% fall. That’s past the 20% line, so it’s a bear market."}, "right": "Both moves are past the 20% line: one up from a low, one down from a high.", "work": "250 ÷ 1,000 = +25%. $12 ÷ $50 = −24%."}}], "measure-in-percent": [{"lesson": "bulls-vs-bears", "chapter": "how-markets-work", "card": {"type": "check", "pose": "detective", "title": "Bull market already?", "q": "A stock rose from **$100** to **$115** this month. Your friend says it’s a bull market. Is he right?", "options": [{"text": "Yes: it’s up $15", "feedback": "Dollars don’t decide it, the percent does. $15 on a $100 stock is 15%, short of 20%."}, {"text": "Not yet: it’s up 15%", "feedback": "The percent decides it. $15 on $100 is 15%, short of the 20% a bull market needs."}, {"text": "Yes: a month of gains is enough", "feedback": "Time doesn’t decide it, the size of the move does. 15% is short of the 20% line."}, {"text": "No: it’s a bear market", "feedback": "A bear market is a fall of about 20% or more. This stock rose 15%."}], "answer": 1, "idea": "measure-in-percent", "work": "$15 ÷ $100 = 15%. A bull market needs about +20%: $100 → $120."}}], "more-buyers-higher-price": [{"lesson": "why-prices-move", "chapter": "how-markets-work", "card": {"type": "call", "pose": "present", "title": "Ten buyers, one seller", "situation": "You own 1 share. The last trade was $50. Ten people want to buy it right now, and nobody else is selling. What do you do?", "visual": {"kind": "crowd", "price": "$50", "priceLabel": "Last trade", "label": "Ten buyers want your one share. The last trade was $50", "sides": [{"label": "buyers", "n": 10, "tone": "up"}, {"label": "seller", "n": 1, "tone": "down", "tag": "You"}]}, "options": [{"text": "Ask for more than $50", "feedback": "Ten buyers, one share: they have to outbid each other. If the deal happens at $52, your app now shows $52. That’s how a price rises."}, {"text": "Sell at $50 to the first person", "feedback": "Ten buyers want one share, so someone will pay $51 or $52. Selling at $50 leaves that money with the buyer."}, {"text": "Wait for the exchange to set a new price", "feedback": "Nobody sets prices from above. The exchange only records where a buyer and a seller agree. That deal becomes the price."}], "answer": 0, "idea": "more-buyers-higher-price", "work": "10 buyers, 1 share: offers climb $50 → $51 → $52. The deal at $52 becomes the price."}}], "expectations-move-prices": [{"lesson": "why-prices-move", "chapter": "how-markets-work", "card": {"type": "exercise", "kind": "sort", "title": "Which way does the price go?", "q": "Drag each situation into the right box.", "idea": "expectations-move-prices", "items": [{"text": "Expected profit $5M, actual $6M", "sub": "Results day"}, {"text": "Expected profit $10M, actual $8M", "sub": "A record, but below hopes"}, {"text": "Sellers rush to get out", "sub": "Bad mood all day"}], "given": [{"item": {"text": "500 buyers, 100 sellers", "sub": "At today’s price"}, "bucket": "up"}], "buckets": [{"id": "up", "label": "Price up", "sub": "more buyers", "tone": "up", "icon": "up"}, {"id": "down", "label": "Price down", "sub": "more sellers", "tone": "down", "icon": "down"}], "solution": {"up": ["Expected profit $5M, actual $6M"], "down": ["Expected profit $10M, actual $8M", "Sellers rush to get out"]}, "itemFeedback": {"Expected profit $5M, actual $6M": "$6M beat the $5M people expected. A good surprise pushes the price up.", "Expected profit $10M, actual $8M": "A record that misses expectations is a letdown. The price falls.", "Sellers rush to get out": "Sellers in a hurry accept less, so each new deal prints lower."}, "right": "Beat the forecast: up. Missed it, even with a record: down. Sellers in a hurry: down.", "work": "$6M vs $5M expected: beat, up. $8M vs $10M expected: miss, down."}}, {"lesson": "why-prices-move", "chapter": "how-markets-work", "card": {"type": "check", "pose": "detective", "title": "Record profits, falling stock", "q": "A company reports record profits. Its stock falls 6% the same day. What best explains it?", "options": [{"text": "Investors expected even better results", "feedback": "Prices move on the gap between results and expectations. If people hoped for more, a record is still a letdown."}, {"text": "Market makers decided to lower the price", "feedback": "Nobody decides the price. It’s the last deal between a buyer and a seller, and here sellers outnumbered buyers."}, {"text": "Too many people wanted to buy", "feedback": "More buyers would push the price up, not down. A 6% fall means sellers outnumbered buyers."}, {"text": "The company created more shares that day", "feedback": "Nothing in the story says new shares. Look for the surprise: results versus what was expected."}], "answer": 0, "idea": "expectations-move-prices", "work": "Expected more than the record → a letdown → more sellers → price −6%."}}, {"chapter": "how-markets-work", "challenge": {"lesson": 2, "q": "A company reports record profits, and its stock jumps 8%. What best explains the jump?", "options": ["Record profits always push a stock up", "The results beat what investors had expected", "Market makers decided to raise the price"], "answer": 1, "why": "Prices move on surprises, not headlines. The stock rose because the results beat expectations. The same record could have fallen if investors had hoped for more.", "idea": "expectations-move-prices"}}], "two-sides-every-trade": [{"lesson": "other-side", "chapter": "how-markets-work", "card": {"type": "call", "pose": "point", "title": "Who sold you those shares?", "situation": "You buy 10 shares of a company in your app. Someone sold them to you. Who?", "visual": {"kind": "ticket", "side": "Buy", "title": "10 shares · $50.00", "sub": "Order filled · just now", "aside": "Seller", "mark": "?"}, "options": [{"text": "The company itself", "feedback": "The company sold its shares long ago, when it first listed. Today you buy from someone who already owns them."}, {"text": "Your app", "feedback": "Your app only passes your order on. The shares come from someone who already owns them and wants to sell."}, {"text": "Another trader, a fund or a market maker", "feedback": "Every trade has two sides. When you buy, someone else sells, and they often have more money and data than you."}, {"text": "Nobody: new shares are created", "feedback": "Buying doesn’t create shares. Someone who already owns them has to sell them to you."}], "answer": 2, "idea": "two-sides-every-trade"}}], "where-you-win": [{"lesson": "other-side", "chapter": "how-markets-work", "card": {"type": "exercise", "kind": "sort", "title": "Who wins this fight?", "q": "Drag each fight into the right box.", "idea": "where-you-win", "items": ["Reacting to news in 0.001 seconds", "Waiting a month for the right setup", "Reading 500 reports on one company"], "given": [{"item": "Selling 20 shares instantly", "bucket": "you"}], "buckets": [{"id": "they", "label": "They win", "sub": "funds, banks, robots", "tone": "down"}, {"id": "you", "label": "You win", "sub": "small and patient", "tone": "up"}], "solution": {"they": ["Reacting to news in 0.001 seconds", "Reading 500 reports on one company"], "you": ["Waiting a month for the right setup"]}, "itemFeedback": {"Reacting to news in 0.001 seconds": "A robot reacts in 0.001 seconds; your thumb needs about 0.3. That’s 300 times slower. Don’t race it.", "Reading 500 reports on one company": "Funds pay whole teams to read every report. Research is their fight.", "Waiting a month for the right setup": "A big fund must stay invested. You can sit in cash for a month. That edge is yours."}, "right": "Speed and research belong to them. Patience and small size belong to you. Pick fights in your box."}}], "your-edge-patience": [{"lesson": "other-side", "chapter": "how-markets-work", "card": {"type": "check", "pose": "detective", "title": "Big news just dropped", "q": "The price jumps in 0.1 seconds. You see the news 5 seconds later. What’s your best move?", "options": [{"text": "Buy now, before it rises more", "feedback": "Robots moved the price in 0.1 seconds. Chasing it means buying from them, late. Your edge is patience, not speed."}, {"text": "Don’t chase it. Stick to your plan", "feedback": "The robots already moved the price. Sticking to your plan keeps you out of a race you can’t win."}, {"text": "Ask a friend at the company what’s next", "feedback": "Trading on secret company information is insider trading. It’s illegal, and never an edge you can use."}, {"text": "Sell everything you own", "feedback": "Panic selling on news you saw late is chasing too, just the other way. Your edge is patience, not speed."}], "answer": 1, "idea": "your-edge-patience"}}, {"chapter": "how-markets-work", "challenge": {"lesson": 3, "q": "Big news hits. Robots trade on it in 0.001 seconds. What’s your smartest move?", "options": ["Race to buy in the first second", "Copy whatever the robots did", "Wait for your plan’s setup"], "answer": 2, "why": "You can’t beat a robot’s speed, and copying it means arriving late. Your edge is patience: let the rush pass and trade only if your setup appears.", "idea": "your-edge-patience"}}], "learn-on-calm-markets": [{"lesson": "asset-classes", "chapter": "how-markets-work", "card": {"type": "call", "pose": "point", "title": "Where does a bad day cost less?", "situation": "You’re new and have $1,000 to practice with. You will make mistakes. Where does one bad day cost you less?", "visual": {"kind": "lines", "layout": "pair", "lo": 0, "hi": 80, "mid": 40, "items": [{"label": "A · Broad index ETF", "sub": "Moves about 1% on a normal day", "tone": "sky", "points": [38, 36, 38, 40, 38, 38, 37, 38, 37, 37, 36, 38, 38, 39, 38, 36, 34, 34, 34, 35, 37, 39, 39, 39, 40, 38, 38, 38, 39, 41]}, {"label": "B · New crypto coin", "sub": "Can swing 10% in a day", "tone": "gold", "points": [37, 30, 22, 9, 8, 8, 21, 22, 10, 8, 8, 19, 20, 27, 26, 23, 37, 45, 51, 40, 32, 42, 33, 43, 40, 51, 65, 54, 62, 70]}]}, "options": [{"text": "The broad index ETF", "feedback": "Smaller swings make each beginner mistake cheaper, so you can afford to learn."}, {"text": "The new crypto coin", "feedback": "Big swings cut both ways, and beginners make more mistakes."}, {"text": "No real difference", "feedback": "A 1% day and a 10% day are very different on the same $1,000. Bigger swings mean bigger bad days."}], "answer": 0, "idea": "learn-on-calm-markets", "work": "Bad day on A: 1% of $1,000 = $10. On B: 10% = $100."}}], "asset-class-risk-ladder": [{"lesson": "asset-classes", "chapter": "how-markets-work", "card": {"type": "exercise", "kind": "sort", "title": "Sort by risk", "q": "Drag each asset class into the right box.", "idea": "asset-class-risk-ladder", "items": ["Crypto", "Stocks", "Broad index ETFs", "Forex", "Commodities"], "given": [{"item": "Bonds", "bucket": "lower"}], "buckets": [{"id": "lower", "label": "Lower risk", "sub": "smaller swings", "tone": "sky"}, {"id": "middle", "label": "Middle", "tone": "gold"}, {"id": "higher", "label": "Higher risk", "sub": "biggest swings", "tone": "down"}], "solution": {"lower": ["Broad index ETFs"], "middle": ["Stocks", "Forex", "Commodities"], "higher": ["Crypto"]}, "itemFeedback": {"Forex": "Forex prices move slowly, so on its own it sits in the middle. Leverage is what makes it risky.", "Crypto": "Crypto swings the most: young, very volatile, and it never sleeps.", "Stocks": "One company can move a lot more than a bond or a basket, but less than crypto: the middle.", "Commodities": "Oil and gold swing more than bonds, less than crypto: the middle.", "Broad index ETFs": "A broad index ETF holds hundreds of companies, so one bad company hurts less. That’s why it sits with bonds. A leveraged or crypto ETF would not."}, "right": "Bonds and broad index ETFs are lower risk, stocks, commodities and forex sit in the middle, and crypto is the riskiest."}}, {"chapter": "how-markets-work", "challenge": {"lesson": 4, "q": "A friend wants his first investment to be steady and to pay him interest. Which class fits best?", "options": ["Bonds", "Forex with leverage", "A new crypto token"], "answer": 0, "why": "A bond is a loan to a government or company. It pays interest and is one of the calmest choices. Leverage and new tokens are the riskiest.", "idea": "asset-class-risk-ladder"}}], "new-coins-riskiest": [{"lesson": "asset-classes", "chapter": "how-markets-work", "card": {"type": "check", "pose": "detective", "title": "Which is the riskiest?", "q": "Your friend wants to practice with his first $500. Which of these usually carries the most risk?", "options": [{"text": "A government bond", "feedback": "A government bond is a loan that pays interest. It’s one of the calmest choices, not the riskiest."}, {"text": "A broad index ETF", "feedback": "An index ETF spreads your money over many companies, so it swings less than any one of them."}, {"text": "Shares of a large company", "feedback": "Large company shares do move. A brand-new coin can swing far more, and few people trade it, so getting out can be hard."}, {"text": "A brand-new crypto coin", "feedback": "A brand-new coin can swing far more than the others, and few people trade it, so getting out can be hard."}], "answer": 3, "idea": "new-coins-riskiest"}}], "spread-is-a-toll": [{"lesson": "bid-ask-spread", "chapter": "how-markets-work", "card": {"type": "call", "pose": "point", "title": "Where did the $0.10 go?", "situation": "You buy a stock at $50.05. A second later your position shows −$0.10 a share, but the price didn’t move. Where did it go?", "visual": {"kind": "position", "label": "Your position", "title": "Bought 1 share @ $50.05", "value": "$49.95", "change": "−$0.10", "tone": "down"}, "options": [{"text": "A bug in the app", "feedback": "Not a bug. Your app shows what you’d get selling now, and that’s less than you paid."}, {"text": "Someone took it", "feedback": "Nobody took it. Your app values your share at what you’d get selling now, a bit less than you paid."}, {"text": "You paid a toll for buying instantly", "feedback": "Buying now costs a bit more than selling now. That gap is the toll for trading instantly."}], "answer": 2, "idea": "spread-is-a-toll", "work": "Paid $50.05 − sell now $49.95 = $0.10 a share."}}], "spread-round-trip-cost": [{"lesson": "bid-ask-spread", "chapter": "how-markets-work", "card": {"type": "exercise", "kind": "choice", "title": "Round trip, no move", "q": "You buy {n} shares and sell them straight away. The price doesn’t move. What’s your result?", "idea": "spread-round-trip-cost", "visual": {"kind": "quotes", "items": [{"label": "Bid", "value": "$49.95", "sub": "you sell here", "tone": "down"}, {"label": "Spread", "value": "$0.10", "sub": "the gap", "tone": "gold"}, {"label": "Ask", "value": "$50.05", "sub": "you buy here", "tone": "up"}]}, "scale": {"label": "Shares", "value": 100, "min": 100, "max": 1000, "step": 100}, "options": [{"text": "$0.00", "feedback": "The price didn’t move, but you bought at the higher ask and sold at the lower bid.", "amount": 0}, {"text": "+$10.00", "feedback": "You can’t gain when the price stands still. You bought at the higher ask and sold at the lower bid.", "amount": 0.1}, {"text": "−$10.00", "feedback": "You bought at the ask and sold at the bid, so you paid the spread on every share.", "amount": -0.1}, {"text": "−$5.00", "feedback": "That’s only half the gap. On a round trip you pay the full spread on every share.", "amount": -0.05}], "answer": 2, "work": "$50.05 − $49.95 = $0.10 a share. × {n} shares = {total} lost."}}, {"chapter": "how-markets-work", "challenge": {"lesson": 5, "q": "You want to put $1,000 into a new token. Bid $0.095, ask $0.105, and only a few thousand dollars of orders on each side. What do you do?", "options": ["The spread doesn’t matter if I hold for years", "Pass, or buy small: you start about 10% down", "Buy $1,000 now: at $0.10 it can only go up"], "answer": 1, "why": "You buy at $0.105 but can only sell at $0.095, so about $95 of your $1,000 is gone at once. Holding doesn’t avoid it, and few orders make the exit worse.", "idea": "spread-round-trip-cost", "visual": {"kind": "depth", "title": "Order book · new token", "aside": "$ of orders", "max": 5000, "label": "Order book: asks $0.105 to $0.115 with $600 to $1,200 each; bids $0.085 to $0.095 with $500 to $1,300 each", "rows": [{"side": "ask", "price": "$0.115", "size": "$600", "value": 600}, {"side": "ask", "price": "$0.110", "size": "$900", "value": 900}, {"side": "ask", "price": "$0.105", "size": "$1,200", "value": 1200, "best": true}, {"side": "bid", "price": "$0.095", "size": "$1,300", "value": 1300, "best": true}, {"side": "bid", "price": "$0.090", "size": "$  49.641, 49.657], [49.669, 49.69, 49.599, 49.6]], "height": 84, "fmt": 2, "ticks": 2, "axis": true, "lastTag": true, "marks": [{"i": 9, "price": 50.04, "tone": "gold", "label": "news"}], "label": "Price near $50, news hits, then it falls fast to $49.60"}}, "options": [{"text": "Sell only if I get $50 or more", "feedback": "It sounds safe, but the price is already under $50 and falling. This order may never fill, and you could still be holding as the price slides."}, {"text": "Do nothing and wait for it to come back", "feedback": "Hoping isn’t a plan. The price may keep falling, and every dollar it drops is another dollar lost on each share."}, {"text": "Sell now, at whatever price buyers will pay", "feedback": "When a price is falling fast, speed matters more than price. You may get a bit less than $50, but you’re out before it drops further."}], "answer": 2, "idea": "market-order-speed", "work": "Sell now: $50 − $49.60 = $0.40 less a share. A $50 limit never fills: still holding at $45 = $5 a share lost."}}], "limit-vs-stop": [{"lesson": "four-orders", "chapter": "orders-leverage", "card": {"type": "exercise", "kind": "choice", "name": "Breakout", "title": "Only if it breaks out", "q": "A stock trades at $30. You want to buy only if it breaks above $32 and shows strength. Which order?", "idea": "limit-vs-stop", "visual": {"kind": "candles", "chart": {"ohlc": [[29.6, 29.7, 29.34, 29.6], [29.64, 29.71, 29.49, 29.66], [29.6, 29.87, 29.48, 29.74], [29.74, 30.02, 29.55, 29.93], [29.92, 30.36, 29.92, 30.32], [30.37, 30.51, 30.24, 30.41], [30.48, 30.51, 30.07, 30.2], [30.22, 30.24, 30.16, 30.2], [30.19, 30.25, 30.1, 30.1], [30.14, 30.16, 29.92, 29.93], [29.87, 29.87, 29.55, 29.65], [29.64, 30.04, 29.42, 30.01], [30.01, 30.14, 29.85, 29.89], [29.85, 30.09, 29.78, 30.07], [30.08, 30.35, 30.06, 30.3], [30.36, 30.5, 30.27, 30.46], [30.47, 30.47, 30.43, 30.45], [30.43, 30.51, 30.27, 30.29], [30.32, 30.34, 30.11, 30.15], [30.22, 30.24, 29.99, 30.0]], "height": 130, "fmt": 1, "ticks": 2, "axis": true, "lastTag": true, "hlines": [{"price": 32, "tone": "sky", "style": "pill", "label": "breakout level $32"}], "label": "Price moving sideways around $30, below a $32 breakout level"}, "foot": "Pick the order to drop on the $32 line."}, "options": [{"text": "Buy limit at $32", "feedback": "A limit at $32 sounds like “at $32”. But a buy limit means “$32 or less”. The price is $30, so it fills right away, before any breakout."}, {"text": "Market order now", "feedback": "It gets you in, but right now at $30. You wanted to wait for proof that the price breaks up to $32."}, {"text": "Buy stop at $32", "feedback": "A buy stop waits above the price and fires only when $32 trades. You buy only once the price shows strength."}, {"text": "Sell stop at $32", "feedback": "The $32 trigger looks right, but a sell stop sells shares. You want to buy."}], "answer": 2, "work": null}}, {"lesson": "four-orders", "chapter": "orders-leverage", "card": {"type": "check", "title": "Buy the dip", "q": "A stock trades at $100. You want to buy only if it dips to $95. Which order?", "options": [{"text": "Sell stop at $95", "feedback": "The $95 level looks right, but a sell stop sells shares. You want to buy."}, {"text": "Buy limit at $95", "feedback": "A buy limit means “at $95 or less”. If the price never dips that far, you don’t buy at all."}, {"text": "Buy stop at $95", "feedback": "A stop sounds like “wait for $95”. But a buy stop fires when the price is at or above its level. The price is already $100, so you’d buy at about $100."}, {"text": "Market order", "feedback": "A market order buys right away at $100. That’s $5 a share more than you wanted to pay."}], "answer": 1, "idea": "limit-vs-stop", "work": null, "pose": "none"}}, {"chapter": "orders-leverage", "challenge": {"lesson": 1, "q": "You buy at $30. You want out automatically if it falls to $27. Which order?", "options": ["A sell stop at $27", "A sell limit at $27", "A buy limit at $27"], "answer": 0, "why": "A s "options": [{"text": "Only if I already own the stock", "feedback": "You don’t need to own it. Your broker can lend you shares to sell now and buy back later. The real catch is the risk, which this lesson shows."}, {"text": "Yes: borrow shares, sell at $80, buy back at $70", "feedback": "Your broker lends you shares. You sell them first, buy them back cheaper later, and return them. The difference is yours."}, {"text": "No: you only make money when prices rise", "feedback": "Most beginners think this. But you can sell first and buy later. That’s called selling short, and it profits from a fall."}], "answer": 1, "idea": "short-selling", "work": "Sell borrowed share at $80 − buy it back at $70 = $10 gain a share."}}], "short-pnl": [{"lesson": "long-and-short", "chapter": "orders-leverage", "card": {"type": "exercise", "kind": "choice", "name": "Short squeeze", "title": "The short goes wrong", "q": "You short 50 shares at $40. The price rises to $46. What’s your result so far?", "idea": "short-pnl", "fields": [{"label": "Shorted", "value": "50"}, {"label": "Sold at", "value": "$40"}, {"label": "Now", "value": "$46"}], "options": [{"text": "+$300", "feedback": "The size is right, but the sign is wrong. A short wins when the price falls. Here the price rose, so the same amount is a loss."}, {"text": "−$46", "feedback": "$46 is the current price, not the result. What counts is how far the price moved from where you sold, times your shares."}, {"text": "−$300", "feedback": "You sold first, so you must buy back. The price is now higher than where you sold, so buying back costs more than you got."}, {"text": "$0, until I close it", "feedback": "Not closing doesn’t stop the loss. If you bought back right now, you’d pay more than you sold for. That loss is real today."}], "answer": 2, "work": "Sold at $40 − buy back at $46 = $6 loss a share. $6 loss × 50 shares = $300 loss."}}, {"chapter": "orders-leverage", "challenge": {"lesson": 2, "q": "You short 200 shares at $25 and buy ses 10%, you’d make $1,000 instead of $100. What’s the catch?", "visual": {"kind": "stacks", "mark": "?", "label": "Your $1,000 becomes a $10,000 trade. How?", "items": [{"label": "You: $1,000", "n": 1, "tone": "gold"}, {"label": "Trade: $10,000", "n": 10, "tone": "gold"}]}, "options": [{"text": "No catch: it’s a free boost", "feedback": "It feels like free money. But the broker isn’t giving you anything. A 10% fall on the bigger position wipes out your whole deposit."}, {"text": "Just a small fee", "feedback": "There are fees (Lesson 4), but they aren’t the main catch. The real catch is size: a 10% fall takes everything you put in."}, {"text": "If the price falls, the loss is 10 times bigger too", "feedback": "Leverage makes every move bigger in both directions. A 10% rise doubles your money, and a 10% fall takes all of it."}], "answer": 2, "idea": "leverage-cuts-both-ways", "work": "10% of the $10,000 position = $1,000 loss on a 10% fall. That equals your whole $1,000 deposit."}}], "leverage-loss-math": [{"lesson": "leverage", "chapter": "orders-leverage", "card": {"type": "exercise", "kind": "choice", "name": "Do the math", "title": "5× on $2,000", "q": "The price falls 4%. What do you lose?", "idea": "leverage-loss-math", "fields": [{"label": "Margin", "value": "$2,000"}, {"label": "Leverage", "value": "5×"}, {"label": "Move", "value": "−4%"}], "options": [{"text": "$80, which is 4% of your margin", "feedback": "That would be right with no leverage. But the 4% move hits the whole position, which is five times your margin."}, {"text": "$2,000, all of it", "feedback": "Leverage makes it feel like everything is at risk. But at 5×, it takes a 20% move to wipe you out. A 4% move costs only part of it."}, {"text": "$400, which is 20% of your margin", "feedback": "With leverage, work out the position first, then apply the move to it. Then compare the loss with your margin."}, {"text": "$8", "feedback": "The percent slipped. Take 4% of the whole position, and check the decimal point."}], "answer": 2, "work": "Position: $2,000 margin × 5 = $10,000. Loss: 4% × $10,000 = $400. $400 loss ÷ $2,000 margin = 20% of your margin lost."}}], "wipe-out-move": [{"lesson": "leverage", "chapter": "orders-leverage", "card": {"type": "check", "title": "The wipe-out move", "q": "With 10× leverage, how far must price move against you to wipe out your margin?", "options": [{"text": "50%", "feedback": "Far less is needed. At 10×, a 50% move would cost five times your margin."}, {"text": "10%", "feedback": "Your position is 10 times your margin. So a move of one tenth of 100% against you equals all your margin."}, {"text": "1%", "feedback": "That would be true at 100× leverage. At 10×, you need a much bigger move to lose everything."}, {"text": "5%", "feedback": "That would be true at 20× leverage. At 10×, it takes twice that move to lose everything."}], "answer": 1, "idea": "wipe-out-move", "work": "100% of your margin ÷ 10× leverage = a 10% move against you wipes it out.", "pose": "none"}}, {"chapter": "orders-leverage", "challenge": {"lesson": 3, "q": "You put $500 in at 20× leverage. How big is the position, and what move wipes you out?", "options": ["$5,000; a 10% move", "$10,000; a 5% move", "$10,000; a 20% move"], "answer": 1, "why": "$500 × 20 = $10,000 position. At 20×, a 5% move against you (100% ÷ 20) costs $500, your whole margin.", "idea": "wipe-out-move", "visual": {"kind": "hbars", "title": "20× leverage", "aside": "to scale", "rows": [{"label": "your $500", "value": 500, "display": "", "tone": "gold", "labelTone": "gold"}, {"label": "position", "value": 10000, "display": "", "tone": "blue", "labelTone": "blue", "inner": {"value": 500, "tone": "gold"}}]}}}], "free-isnt-free": [{"lesson": "hidden-costs", "chapter": "orders-leverage", "card": {"type": "call", "pose": "point", "name": "The ad", "title": "Free trading?", "situation": "An app’s ad says: “Zero commission! Trading is free.” The app has hundreds of staff to pay. Is trading there really free?", "visual": {"kind": "ad", "badge": "ZERO", "badgeSub": "COMMISSION!", "title": "Trading is free.", "sub": "Hundreds of staff…", "mark": "?"}, "options": [{"text": "Only big trades cost anything", "feedback": "Costs hit every trade, big or small. Even 10 shares with a $0.05 wider spread cost $0.50 a round trip, and that adds up."}, {"text": "No: they earn from my trades another way", "feedback": "Commission is only one fee. “Free” apps earn by selling your orders to market makers (payment for order flow) and through a wider spread, the bid–ask gap from Chapter 1."}, {"text": "Yes: zero commission means zero cost", "feedback": "It sounds like zero cost. But the app still earns on every buy and sell, through a wider spread or by selling your orders (payment for order flow)."}], "answer": 1, "idea": "free-isnt-free", "work": "Spread $0.05 wider × 100 shares = $5 extra cost on every round trip."}}], "total-trading-cost": [{"lesson": "hidden-costs", "chapter": "orders-leverage", "card": {"type": "exercise", "kind": "choice", "name": "Compare the bills", "title": "Which broker is cheaper?", "q": "You buy and sell 100 shares 10 times a month. Which broker costs less per month?", "idea": "total-trading-cost", "visual": {"kind": "columns", "cols": [{"title": "BROKER A", "rows": [{"label": "Fee per trade", "value": "$0"}, {"label": "Spread per share", "value": "$0.06"}], "tone": "sky", "tint": true}, {"title": "BROKER B", "rows": [{"label": "Fee per trade", "value": "$1"}, {"label": "Spread per share", "value": "$0.01"}], "tone": "pro", "tint": true}]}, "options": [{"text": "Broker A: zero commission is cheapest", "feedback": "Zero commission looks cheapest. But A’s spread is much wider, and you pay it on every share of every trade."}, {"text": "Same cost", "feedback": "The costs come in different forms, but they don’t match. Add each broker’s commission and spread before comparing."}, {"text": "Broker B: $30 vs $60", "feedback": "Broker B charges a commission, but its spread is so narrow that its total cost is half of A’s."}, {"text": "Broker B: $20 vs $60", "feedback": "That counts only B’s commission. B has a spread too; add it in."}], "answer": 2, "work": "A: $0.06 spread × 100 shares × 10 trips = $60 cost. B: $1 × 2 trades × 10 trips = $20 commission + $0.01 × 100 × 10 = $10 spread = $30 cost."}}, {"chapter": "orders-leverage", "challenge": {"lesson": 4, "q": "You buy and sell 100 shares once. Broker A: $0 commission, $0.05 spread. Broker B: $1 per trade, $0.01 spread. Which is cheaper?", "options": ["Broker A: $0 vs $2", "Same cost", "Broker B: $3 vs $5"], "answer": 2, "why": "Add both costs. A: $0.05 spread × 100 shares = $5. B: $1 × 2 trades = $2 commission + $0.01 × 100 = $1 spread, $3 total.", "idea": "total-trading-cost"}}], "swap-every-night": [{"lesson": "hidden-costs", "chapter": "orders-leverage", "card": {"type": "check", "title": "The overnight bill", "q": "You hold a $10,000 leveraged position for 30 nights. The swap is $1 a night. What does holding it cost?", "options": [{"text": "$0, the price didn’t move", "feedback": "Swap is charged every night you hold, even if the price never moves."}, {"text": "$30", "feedback": "Swap is charged for every night you hold, whatever the price does. Thirty nights means thirty charges."}, {"text": "$1", "feedback": "That’s one night. You held it for 30, and the swap is charged every night."}, {"text": "$300", "feedback": "Check the decimal point. It’s $1 a night, for 30 nights, not $10 a night."}], "answer": 1, "idea": "swap-every-night", "work": "$1 × 30 nights = $30, taken from your account.", "pose": "none"}}], "overnight-gap": [{"lesson": "overnight-gamble", "chapter": "orders-leverage", "card": {"type": "call", "pose": "worried2", "name": "After hours", "title": "Closed for the night", "situation": "You own a stock. It closes at $50 at 4 pm. At 11 pm, bad news comes out. Your broker trades regular hours only, 9:30 am to 4 pm. When can you sell?", "visual": {"kind": "timeline", "points": [{"label": "4 pm", "sub": "closes $50", "tone": "white"}, {"label": "11 pm", "sub": "bad news", "tone": "down"}, {"label": "9:30 am", "sub": "opens ?", "tone": "gold"}], "badge": {"text": "REGULAR HOURS CLOSED", "tone": "down", "from": 0, "to": 2}}, "options": [{"text": "In the morning, at yesterday’s $50", "feedback": "It feels like the last price still holds. But after bad news, buyers set a new, lower price at the open."}, {"text": "At the open, at whatever buyers pay", "feedback": "Few people trade overnight, and your broker waits for the regular session. The first price you get is whatever buyers will pay at the open, often far below the close."}, {"text": "Right away at 11 pm, at $50", "feedback": "It feels like you can act the moment news comes out. But your broker only trades regular hours, so you can’t sell until the open."}], "answer": 1, "idea": "overnight-gap", "work": "Closed at $50 − first trade at $45 = $5 loss a share."}}], "size-for-the-gap": [{"lesson": "overnight-gamble", "chapter": "orders-leverage", "card": {"type": "exercise", "kind": "choice", "name": "Overnight gamble", "title": "Earnings tonight", "q": "You have $5,000. A friend says a stock will “definitely” jump after [[earnings|earnings]] tonight (the company’s results, a big-move day). Your broker offers 20×. The stock can gap 20% on earnings day. What do you do?", "idea": "size-for-the-gap", "options": [{"text": "$5,000 position, no leverage", "feedback": "No leverage helps, but a 20% gap the wrong way still costs $1,000, a fifth of your account in one night."}, {"text": "$250 position, 1% at risk if it gaps 20%", "feedback": "A gap can jump past a stop, so size is your real protection: a 20% gap on $250 costs $50. A friend’s “definitely” isn’t a plan."}, {"text": "$100,000 position at 20×", "feedback": "A “sure thing” makes big leverage tempting. But a 20% gap the wrong way loses far more than your account."}, {"text": "$25,000 position at 5×", "feedback": "Less reckless, but a 20% gap the wrong way costs $5,000: your whole account in one night."}], "answer": 1, "work": "20× = $100,000. A 20% gap = $20,000 loss, 4× your $5,000. Safer: $50 ÷ 20% = $250."}}, {"chapter": "orders-leverage", "challenge": {"lesson": 5, "q": "Your account is $10,000 and you risk 1% on a stock that often gaps 10% on news. What’s the largest sensible position?", "options": ["$1,000", "$10,000", "$100"], "answer": 0, "why": "1% of $10,000 = $100 you can risk. A 10% gap should cost no more than that: $100 ÷ 10% = $1,000 position.", "idea": "size-for-the-gap", "visual": {"kind": "candles", "title": "Daily · 1 month", "chart": {"height": 90, "axis": false, "lastTag": false, "ticks": 0, "noise": 0.3, "path": [[0, 50], [2, 51.5], [3, 52.5], [4, 52.4], [5, 47.2], [6, 46.5], [7, 46.8], [8, 46.3], [9, 45.8], [10, 50.5], [11, 50.8], [12, 51.3], [14, 50.6]], "n": 15, "seed": 23, "vlines": [{"i": 5, "label": "gap −10%", "tone": "gold"}, {"i": 10, "label": "gap +10%", "tone": "gold"}], "label": "Two overnight gaps of about 10%, one down and one up"}}}}], "size-beats-stop-on-gaps": [{"lesson": "overnight-gamble", "chapter": "orders-leverage", "card": {"type": "check", "title": "Your real protection", "q": "Why is position size, not a stop-loss, your real protection against an overnight earnings gap?", "options": [{"text": "A stop guarantees your price", "feedback": "It doesn’t. A stop becomes a market order, so after a gap it fills at the opening price, which may be far past your level."}, {"text": "Brokers cancel stops before earnings", "feedback": "Brokers don’t cancel stops. The problem is the gap: the price jumps past your stop overnight."}, {"text": "A stop makes the gap bigger", "feedback": "Stops don’t cause gaps. News does. A stop just can’t control the price you get after a gap."}, {"text": "A gap can jump the stop; small size limits the hit", "feedback": "If the stock opens far below your stop, the stop fills at the open, not at your level. Only a small position keeps that loss small."}], "answer": 3, "idea": "size-beats-stop-on-gaps", "work": null, "pose": "none"}}], "candle-body-close": [{"lesson": "one-candle-four-prices", "chapter": "reading-charts", "card": {"type": "call", "title": "Where did it end the day?", "situation": "This green candle is one day of trading. Where did the price close?", "visual": {"kind": "candle", "items": [{"ohlc": [100, 108, 97, 105], "labels": {"open": "?", "high": "?", "low": "?", "close": "?"}, "label": "A green candle with four unknown prices"}]}, "options": [{"text": "$108, the top of the thin line", "feedback": "The thin line is the wick. It shows how high price went, not where it ended."}, {"text": "$105, the top of the thick part", "feedback": "The thick part is the body. On a green candle, its top is the close."}, {"text": "$97, the bottom", "feedback": "The bottom of the lower wick is the day’s low. On a green candle, the close is the top of the body."}], "answer": 1, "idea": "candle-body-close", "work": "Green = it closed above where it opened. Top of the body = close = $105. The thin line above reaches the day’s high, $108."}}, {"lesson": "one-candle-four-prices", "chapter": "reading-charts", "card": {"type": "exercise", "kind": "choice", "title": "Read the red candle", "q": "It opened at $50, went up to $51 and down to $45. Where did it close?", "idea": "candle-body-close", "visual": {"kind": "candle", "items": [{"ohlc": [50, 51, 45, 46], "labels": {"close": "?"}, "label": "A red candle: open $50, high $51, low $45, close unknown"}]}, "options": [{"text": "$51", "feedback": "$51 is the high, the top of the upper wick. Price only touched it."}, {"text": "$50", "feedback": "$50 is the open, the top of the red body. A red candle closes below its open."}, {"text": "$46", "feedback": "A red body runs from the open at the top down to the close at the bottom: $46."}, {"text": "$45", "feedback": "$45 is the low, the bottom of the wick. A red body ends at the close."}], "answer": 2, "work": "Red body: open $50 at the top, close $46 at the bottom."}}, {"chapter": "reading-charts", "challenge": {"lesson": 1, "q": "This red candle opened at $50. Where did it close?", "visual": {"kind": "candle", "title": "Daily · one candle", "axis": true, "items": [{"ohlc": [50, 52, 46, 47], "label": "A red candle: body from $50 down to $47, wicks up to $52 and down to $46"}]}, "options": ["$47: $3 below its open", "$50: red means it closed at the open", "$46: the bottom of the wick"], "answer": 0, "why": "A red body runs from the open at the top down to the close at the bottom: $47. The wick below reaches the low, $46.", "work": "Open $50 − close $47 = $3 lower: a red candle.", "idea": "candle-body-close"}}], "wick-rejection": [{"lesson": "one-candle-four-prices", "chapter": "reading-charts", "card": {"type": "check", "title": "The long top wick", "q": "A candle has a long upper wick and closes near where it opened. What happened?", "visual": {"kind": "candle", "items": [{"ohlc": [50, 56, 49.8, 50.3], "labels": false, "label": "A small green body at the bottom with a long upper wick"}]}, "options": [{"text": "Buyers pushed it up, then sellers pushed it back", "feedback": "The long wick is a round trip: buyers took price far up, and sellers pushed it back before the close."}, {"text": "The price never moved", "feedback": "The body is small, but the wick shows price went far up before it came back."}, {"text": "The market was closed", "feedback": "A closed market makes no candle at all. This one shows a big move up and back."}, {"text": "Sellers won all day", "feedback": "If sellers had won all day, you’d see a long red body. This candle closed near its open."}], "answer": 0, "idea": "wick-rejection"}}], "hammer": [{"lesson": "candles-that-tell-a-story", "chapter": "reading-charts", "card": {"type": "call", "title": "After a long fall", "situation": "The price fell for four days. Then this candle: a small body near the top and a long lower wick. What might it tell you?", "visual": {"kind": "candles", "title": "5 days", "aside": "−11%", "chart": {"axis": false, "lastTag": false, "ticks": 0, "ohlc": [[109.6, 110.4, 106.6, 107.2], [107.2, 107.8, 104.2, 104.8], [104.8, 105.3, 101.8, 102.3], [102.3, 102.8, 99.6, 100.2], [98.2, 98.6, 90, 97.5]], "height": 120, "extra": [{"price": 86}], "dim": [0, 1, 2, 3], "marks": [{"i": 4, "price": 90, "tone": "gold", "label": "today", "pos": "below"}], "label": "Four falling days, then a candle with a small body near the top and a long lower wick down to $90"}}, "options": [{"text": "Sellers are getting even stronger", "feedback": "Sellers pushed it down to $90, but buyers pulled it most of the way back."}, {"text": "Buyers fought back from the lows", "feedback": "That long lower wick is buyers fighting back. It’s called a [[hammer|hammer]]."}, {"text": "Nothing: candles are random", "feedback": "Each candle records the day’s fight. A long lower wick after a fall shows buyers pushed back hard."}], "answer": 1, "idea": "hammer", "work": "Low $90, close $97.50: buyers pushed price back up $7.50 from the low."}}], "doji": [{"lesson": "candles-that-tell-a-story", "chapter": "reading-charts", "card": {"type": "exercise", "kind": "choice", "title": "Spot the doji", "q": "Which candle shows that buyers and sellers ended the day even?", "idea": "doji", "options": [{"text": "Candle A", "candles": [[50.4, 50.6, 46, 50]], "feedback": "Candle A is a hammer: small body, long lower wick. A doji opens and closes at almost the same price."}, {"text": "Candle B", "candles": [[50, 52, 48, 50.05]], "feedback": "Open and close at almost the same price: neither side won the day. That’s a [[doji|doji]]."}, {"text": "Candle C", "candles": [[46, 50.3, 45.8, 50]], "feedback": "A long green body: buyers won that day. A doji opens and closes at almost the same price."}, {"text": "Candle D", "candles": [[50, 50.4, 45.9, 46.2]], "feedback": "A long red body: sellers won that day. A doji opens and closes at almost the same price."}], "answer": 1}}, {"chapter": "reading-charts", "challenge": {"lesson": 2, "q": "After a 10-day rise, today brings a doji at $80. What does it say?", "visual": {"kind": "candles", "title": "Daily · 11 days", "aside": "today", "asideTone": "gold", "chart": {"axis": false, "lastTag": false, "ticks": 0, "ohlc": [[70, 70.9, 69.7, 70.8], [70.8, 71.9, 70.6, 71.7], [71.7, 72.6, 71.5, 72.4], [72.4, 73.6, 72.2, 73.4], [73.4, 74.4, 73.2, 74.2], [74.2, 75.3, 74, 75.1], [75.1, 76.4, 74.9, 76.2], [76.2, 77.2, 76, 77], [77, 78.1, 76.8, 77.9], [77.9, 79.2, 77.7, 79], [79.6, 80.5, 79.4, 79.62]], "height": 80, "marks": [{"i": 10, "price": 80, "tone": "gold", "label": "$80", "pos": "below"}], "label": "Ten rising days, then a doji at $80"}}, "options": ["Sell now: the rise is over", "Buyers are stronger than ever", "Indecision: a clue to watch, not a signal"], "answer": 2, "why": "A doji shows a draw between buyers and sellers. After a long rise it’s a clue to watch, never a sell signal on its own.", "work": "Open $80, close $80: nobody won the day. Wait for the next candles.", "idea": "doji"}}], "pattern-context": [{"lesson": "candles-that-tell-a-story", "chapter": "reading-charts", "card": {"type": "check", "title": "Wrong place", "q": "A hammer shows up in the middle of a quiet, sideways week. No fall came before it. What does it tell you?", "options": [{"text": "A strong buy signal", "feedback": "A hammer means buyers fought back after a fall. With no fall before it, there was nothing to fight back from."}, {"text": "Not much: shapes matter where they appear", "feedback": "A hammer means something after a fall or at a level. In a quiet sideways week, it carries little weight."}, {"text": "Sell now", "feedback": "Nothing here says sell. It’s one candle in a quiet week, not a reason to act."}, {"text": "The trend just turned up", "feedback": "One candle in a sideways week can’t turn a trend. There was no trend to turn."}], "answer": 1, "idea": "pattern-context"}}], "timeframes-differ": [{"lesson": "timeframes", "chapter": "reading-charts", "card": {"type": "call", "title": "Up or down?", "situation": "The same stock, two charts. The hourly chart is falling. The daily chart is rising. Which one is right?", "visual": {"kind": "chart-pair", "items": [{"label": "Hourly", "aside": "8 hours", "tone": "white", "chart": {"axis": false, "lastTag": false, "ticks": 0, "path": [[0, 102.2], [2, 102], [5, 101], [8, 100]], "seed": 7, "height": 110, "noise": 1.4, "wick": 1, "label": "Hourly: today falls from $102 to $100"}}, {"label": "Daily", "aside": "3 months", "tone": "white", "chart": {"axis": false, "lastTag": false, "ticks": 0, "path": [[0, 80], [6, 86], [12, 96], [14, 102], [15, 100]], "seed": 4, "height": 110, "noise": 1.2, "wick": 1, "label": "Daily: three months rising from $80 to $100"}}]}, "options": [{"text": "Down: the latest chart wins", "feedback": "The hourly chart only shows today’s small dip. Zoom out and the bigger move is up."}, {"text": "Up: longer charts are always right", "feedback": "Longer charts aren’t always right; they just cover more time. Both charts are true for their own time span."}, {"text": "Both: they show different time spans", "feedback": "Both are true. A small dip can sit inside a bigger rise."}], "answer": 2, "idea": "timeframes-differ", "work": "Last 8 hours: −$2. Last 3 months: +$20."}}], "match-timeframe-to-hold": [{"lesson": "timeframes", "chapter": "reading-charts", "card": {"type": "exercise", "kind": "choice", "title": "Pick the chart", "q": "You plan to hold a trade for 2 to 3 weeks. Which chart should you trade from?", "idea": "match-timeframe-to-hold", "visual": {"kind": "tabs", "items": ["1m", "1H", "1D", "1W"]}, "options": [{"text": "1-minute", "feedback": "1-minute candles show noise you’ll never hold through. For weeks, use daily candles and check the weekly."}, {"text": "1-hour", "feedback": "Hourly candles fit trades that last hours. For a hold of weeks, the daily chart shows the moves  shares. A traded 3M. B traded 0.5M."}}, {"chapter": "reading-charts", "challenge": {"lesson": 4, "q": "A stock breaks above $40 on 500,000 shares. It usually trades 1,000,000 a day. How believable is the breakout?", "visual": {"kind": "candles", "title": "Daily · 2 weeks", "chart": {"axis": false, "lastTag": false, "ticks": 0, "ohlc": [[37, 37.5, 36.6, 37.3], [37.3, 37.8, 37, 37.6], [37.6, 37.9, 37.3, 37.4], [37.4, 38.1, 37.2, 37.9], [37.9, 38.6, 37.8, 38.4], [38.4, 38.6, 38, 38.2], [38.2, 38.7, 38, 38.5], [38.5, 39.1, 38.4, 38.9], [38.9, 39.2, 38.5, 38.7], [38.7, 39.4, 38.6, 39.2], [39.3, 40.9, 39.2, 40.6]], "height": 80, "priceLabel": "Price", "hlines": [{"price": 40, "tone": "gold", "label": "$40", "style": "left"}], "volume": [1, 1.1, 0.9, 1.2, 1, 1.1, 0.9, 1, 1.2, 1, 0.5], "volAvg": 1, "volAvgLabel": "average 1M", "volLabel": "Volume", "volHeight": 34, "label": "Price breaks above $40 on half the average volume"}}, "options": ["Very: the price broke out, that’s enough", "Weak: half the usual crowd joined", "Bearish: low volume means it will fall"], "answer": 1, "why": "Few people backed this move, so it’s easier to reverse. Low volume shows a weak move, not which way price goes next.", "work": "500,000 ÷ 1,000,000 = 0.5: half a normal day.", "idea": "volume-confirms-breakout"}}], "volume-fading-rise": [{"lesson": "volume", "chapter": "reading-charts", "card": {"type": "exercise", "kind": "choice", "title": "Rising on fumes", "q": "The price rose five days in a row, but each day traded fewer shares than the day before. What does that suggest?", "idea": "volume-fading-rise", "visual": {"kind": "candles", "title": "5 days", "chart": {"axis": false, "lastTag": false, "ticks": 0, "ohlc": [[50, 50.9, 49.7, 50.7], [50.7, 51.8, 50.5, 51.5], [51.5, 52.2, 51.3, 52], [52, 52.4, 51.9, 52.3], [52.3, 52.6, 52.2, 52.45]], "height": 70, "volume": [4.2, 3.5, 3, 2.3, 1.6], "volHeight": 36, "label": "Five rising candles while volume shrinks every day"}}, "options": [{"text": "The rise is getting stronger", "feedback": "Price is still rising, but fewer people are backing it each day. That’s a rise running out of buyers."}, {"text": "Fewer buyers are joining: be careful", "feedback": "Price is rising, but fewer shares trade each day. Fewer buyers are joining, so the rise is easier to reverse."}, {"text": "Volume data is broken", "feedback": "Falling volume is normal data, not an error. It tells you fewer people are trading the move."}, {"text": "Buy more now", "feedback": "Buying more into a rise that fewer people back is risky. Wait for volume to confirm the move."}], "answer": 1}}], "volume-strength-not-direction": [{"lesson": "volume", "chapter": "reading-charts", "card": {"type": "check", "title": "What volume tells you", "q": "Volume on a chart tells you…", "options": [{"text": "Which way price will go next", "feedback": "Volume shows how strong a move is. It doesn’t say which way price goes next."}, {"text": "How many people backed the move", "feedback": "Volume counts the shares traded: how many people backed the move. That’s its strength, not its direction."}, {"text": "The company’s profit", "feedback": "Profit comes from the company’s earnings. Volume counts the shares traded on the chart."}, {"text": "The spread", "feedback": "The spread is the gap between bid and ask. Volume counts how many shares changed hands."}], "answer": 1, "idea": "volume-strength-not-direction"}}], "support-level": [{"lesson": "support-and-resistance", "chapter": "reading-charts", "card": {"type": "call", "title": "The third visit", "situation": "This stock bounced off $40 three times this year. Now it’s falling toward $40 again. What often happens?", "visual": {"kind": "candles", "title": "Daily · this year", "chart": {"axis": false, "lastTag": false, "ticks": 0, "ohlc": [[44.5, 45.2, 43.8, 44], [44, 44.3, 40.4, 41], [41, 43.4, 40.8, 43], [43, 45.6, 42.8, 45.2], [45.2, 45.4, 40.3, 41.2], [41.2, 42, 40.5, 41.6], [41.6, 44.8, 41.4, 44.5], [44.5, 45, 40.6, 4 s": false, "lastTag": false, "ticks": 0, "ohlc": [[66, 66.4, 64.6, 64.9], [64.9, 65.1, 62.8, 63.1], [63.1, 63.3, 60.4, 60.9], [60.9, 62.6, 60.3, 62.3], [62.3, 64.4, 62, 64.1], [64.1, 65.6, 63.8, 65.3], [65.3, 65.5, 63.2, 63.5], [63.5, 63.7, 61.2, 61.5], [61.5, 61.7, 60.2, 60.6], [60.6, 61.6, 60.4, 61.3], [61.3, 62.3, 61.1, 62]], "height": 100, "extra": [{"price": 59}], "hlines": [{"price": 60, "tone": "gold", "label": "support $60", "style": "below"}], "marks": [{"i": 10, "price": 62, "tone": "blue", "label": "buy $62"}], "label": "Price bounces off $60 twice; you buy at $62"}}, "options": ["$60, right on support", "$58, a little below the zone", "$61.50, just under your entry"], "answer": 1, "why": "Support is a zone, and price often pokes into it before turning. A stop on $60 or at $61.50 gets hit by normal noise; a little below the zone gives the trade room.", "work": "Entry $62 − stop $58 = $4 risk a share.", "idea": "stop-beyond-zone"}}], "broken-support-resistance": [{"lesson": "support-and-resistance", "chapter": "reading-charts", "card": {"type": "check", "title": "Old floor", "q": "Support at $40 broke and price fell to $35. Now it’s rising back to $40. What might $40 act as now?", "options": [{"text": "Support", "feedback": "Once a floor breaks, it often becomes a ceiling. Sellers wait there."}, {"text": "Resistance", "feedback": "Broken support often turns into resistance: buyers trapped at $40 sell there to get out even."}, {"text": "Nothing", "feedback": "$40 still matters: many traders remember it. Once a floor breaks, it often becomes a ceiling."}, {"text": "A buy signal", "feedback": "Price rising into an old floor is no buy signal. Traders trapped at $40 often wait there to sell."}], "answer": 1, "idea": "broken-support-resistance"}}], "read-the-swings": [{"lesson": "what-a-trend-really-is", "chapter": "trends-patterns-indicators", "card": {"type": "call", "pose": "think", "title": "Which way is it going?", "situation": "This stock zigzags. Its lows es", "title": "Daily", "legend": [{"label": "neckline $80", "tone": "gold", "dashed": true}], "chart": {"path": [[0, 74], [4, 84], [7, 80.3], [10, 88], [13, 80.2], [16, 84.5], [19, 78]], "seed": 65, "height": 120, "axis": false, "lastTag": false, "ticks": 0, "hlines": [{"price": 80, "tone": "gold"}], "swings": [{"i": 4, "price": 84, "label": "left"}, {"i": 10, "price": 88, "label": "head"}, {"i": 16, "price": 84.5, "label": "right"}], "marks": [{"i": 19, "price": 78, "label": "$78", "tone": "down", "pos": "below"}], "label": "A head and shoulders; price closes at $78 below the $80 neckline"}}}}], "failed-pattern": [{"lesson": "head-and-shoulders", "chapter": "trends-patterns-indicators", "card": {"type": "check", "title": "It bounced", "q": "A head and shoulders formed. Price touched the neckline, bounced, and rose above the right shoulder. What now?", "options": [{"text": "Sell anyway: the shape is there", "feedback": "The shape was there, but the neckline held. No break means the pattern failed, so there’s nothing to act on."}, {"text": "The pattern failed: no break, no signal", "feedback": "The neckline held and price climbed back over the right shoulder. No break, no signal: the pattern failed."}, {"text": "A rise is now guaranteed", "feedback": "Nothing is guaranteed. A failed top only means this pattern gave no signal."}, {"text": "Draw a new neckline lower", "feedback": "Moving the neckline to fit is forcing it. The neckline held, so the pattern failed."}], "answer": 1, "idea": "failed-pattern"}}], "overbought-isnt-sell": [{"lesson": "rsi-overbought", "chapter": "trends-patterns-indicators", "card": {"type": "call", "pose": "worried", "title": "“Overbought. Sell!”", "situation": "A stock has climbed for weeks. Its RSI reads 75, above 70. Your friend says: “Overbought. Sell!” Is he right?", "visual": {"kind": "candles", "title": "Daily", "chart": {"path": [[0, 50], [15, 52], [25, 58], [40, 66], [50, 72]], "seed": 31, "height": 80, "axis": false, "lastTag": fal dicators", "card": {"type": "exercise", "kind": "choice", "title": "Above zero", "idea": "macd-above-zero", "q": "The MACD line is above zero. What does that mean?", "options": [{"text": "The fast average is above the slow one", "feedback": "Above zero means the fast average sits above the slow one: recent prices average higher than older ones."}, {"text": "The company made a profit", "feedback": "MACD is built from price only. It knows nothing about the company’s profits."}, {"text": "Price will rise tomorrow", "feedback": "MACD only describes the past. Above zero means recent prices average higher than older ones."}, {"text": "Volume is above normal", "feedback": "MACD doesn’t use volume. Above zero means the fast average is above the slow one."}], "answer": 0, "work": "Fast average $52 − slow average $50 = +2."}}], "macd-lags": [{"lesson": "macd-in-plain-words", "chapter": "trends-patterns-indicators", "card": {"type": "check", "title": "Always after", "q": "Why do MACD crossovers usually come after a turn has already started?", "options": [{"text": "They’re built from moving averages, which lag", "feedback": "Averages of past prices turn after price does, so a MACD cross confirms a turn rather than calls it."}, {"text": "The data arrives a day late", "feedback": "The data isn’t late. The lag comes from averaging past prices: the averages turn after price does."}, {"text": "They use volume, which comes later", "feedback": "MACD doesn’t use volume at all. It lags because it’s built from moving averages of past prices."}, {"text": "They predict the next turn", "feedback": "MACD can’t see ahead. It’s made of averages of past prices, so its crosses come after the turn."}], "answer": 0, "idea": "macd-lags"}}], "same-input-indicators": [{"lesson": "confluence-over-clutter", "chapter": "trends-patterns-indicators", "card": {"type": "call", "pose": "detective", "title": "Five out of five", "situation": "You have RSI, Stochastic, CCI, Williams %R and Ultimate Oscillator on your chart. All five say “oversold”. How strong is that evidence?", "visual": {"kind": "stats", "cols": 2, "foot": "All built from recent prices", "items": [{"text": "RSI · oversold"}, {"text": "Stochastic · oversold"}, {"text": "CCI · oversold"}, {"text": "Williams %R · oversold"}, {"text": "Ultimate Oscillator · oversold"}]}, "options": [{"text": "Very strong: five out of five agree", "feedback": "All five are momentum gauges built from the same prices. Five copies of one opinion is still one opinion."}, {"text": "About one signal: they all measure the same thing", "feedback": "They all ask the same question: did price fall fast? One yes, said five times."}, {"text": "None: indicators never work", "feedback": "They’re not worthless: they agree that price fell fast. But they all read the same prices, so count it as about one signal."}], "answer": 1, "idea": "same-input-indicators", "work": "5 momentum gauges, 1 input: recent prices. 5 copies of 1 view."}}], "volume-adds-information": [{"lesson": "confluence-over-clutter", "chapter": "trends-patterns-indicators", "card": {"type": "exercise", "kind": "choice", "title": "Pick the extra check", "idea": "volume-adds-information", "q": "Price bounces off support in an uptrend. You already have RSI. Which check adds new information?", "options": [{"text": "Stochastic, to go with your RSI", "feedback": "Stochastic and RSI both measure momentum from the same prices. Volume answers a new question: who’s behind the bounce."}, {"text": "Volume on the bounce", "feedback": "Volume answers a question RSI can’t: who’s behind the bounce. That’s new information."}, {"text": "A second RSI with other settings", "feedback": "A second RSI reads the same prices the same way. It repeats what you already know."}, {"text": "A third moving average", "feedback": "Another average repeats the trend question you’ve already answered. Volume answers a new one: who’s behind the bounce."}], "answer": 1}}], "real-confluence": [{"lesson": "confluence-over-clutter", "chapter": "trends-patterns-indicators", "card": {"type": "check", "title": "Real confluence", "q": "Which of these setups has real confluence?", "options": [{"text": "RSI, Stochastic and CCI all oversold", "feedback": "Three momentum gauges repeat one view. Trend, level and volume answer three different questions."}, {"text": "Uptrend, bounce at support, high volume", "feedback": "Trend, level and volume each answer a different question. When all three agree, that’s confluence."}, {"text": "Three moving averages all rising", "feedback": "Three averages all answer the same question: which way? That’s one view repeated."}, {"text": "MACD and its bars both turning up", "feedback": "The bars are built from the MACD line itself. They repeat one view, so that isn’t confluence."}], "answer": 1, "idea": "real-confluence"}}, {"chapter": "trends-patterns-indicators", "challenge": {"lesson": 8, "q": "You use a 50-day average for the trend. Which pair adds the most new information?", "options": ["A 20-day and a 100-day average", "Support levels and volume", "RSI and Stochastic"], "answer": 1, "why": "More averages repeat the trend question, and RSI with Stochastic repeat one momentum view. Levels and volume answer new questions: where, and who’s behind it.", "idea": "real-confluence", "visual": {"kind": "candles", "title": "Your chart now", "legend": [{"label": "50-day", "tone": "gold"}], "chart": {"path": [[0, 52], [8, 60], [12, 64], [18, 58.5], [22, 61.5]], "seed": 68, "height": 110, "axis": false, "lastTag": false, "ticks": 0, "overlays": [{"values": [51.0, 51.39, 51.77, 52.16, 52.53, 52.9, 53.27, 53.63, 53.99, 54.34, 54.69, 55.03, 55.37, 55.7, 56.03, 56.36, 56.68, 56.99, 57.3, 57.61, 57.91, 58.21, 58.5], "tone": "gold"}], "label": "Price above a rising 50-day average"}}}}], "half-loss-double-gain": [{"lesson": "math-that-ends-careers", "chapter": "risk-management", "card": {"type": "call", "pose": "worried2", "title": "Half the account, gone", "situation":
