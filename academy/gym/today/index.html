archart", "title": "Returns", "label": "You 14%, the index 18%, cash 4%", "groups": [{"label": "You", "values": [14], "displays": ["14%"], "tones": ["blue"]}, {"label": "Index", "values": [18], "displays": ["18%"], "tones": ["gold"]}, {"label": "Cash", "values": [4], "displays": ["4%"], "tones": ["muted"]}]}, "idea": "return-vs-benchmark"}}], "beat-after-costs": [{"lesson": "measuring-your-results", "chapter": "portfolio-management", "card": {"type": "exercise", "kind": "choice", "title": "Did you beat it?", "q": "You made 10% before costs and paid 1.5% in fees and trading costs. The index fund returned 9% after its own fee. Did you beat it?", "idea": "beat-after-costs", "options": [{"text": "Yes, by 1 point", "feedback": "10% is before costs. Take the costs off first, then compare."}, {"text": "No, you lagged by 0.5 point", "feedback": "After costs you made 8.5%, just under the index fund’s 9%."}, {"text": "Yes, by 2.5 points", "feedback": "That adds the costs instead of taking them off. Costs come out of your return."}, {"text": "They can’t be compared", "feedback": "They can: both are after-cost returns once you take your 1.5% off."}], "answer": 1, "work": "10% − 1.5% = 8.5%. The index: 9%. You lagged by 0.5 point."}}], "right-benchmark": [{"lesson": "measuring-your-results", "chapter": "portfolio-management", "card": {"type": "check", "title": "The right bar", "q": "Your portfolio holds large US companies. Which benchmark fits best?", "options": [{"text": "A broad large-stock index", "feedback": "Large stocks belong next to a large-stock index: same kind of assets, same risks."}, {"text": "The bank’s savings rate", "feedback": "A savings rate carries almost no risk, so beating it says little. Large stocks belong next to a large-stock index."}, {"text": "The price of gold", "feedback": "Gold is a different asset with its own drivers. Compare like with like."}, {"text": "A friend’s returns", "feedback": "A friend’s returns could be luck, or a different mix. Use an ack": "Peak to low: $10,000 off $40,000."}, {"text": "33%", "feedback": "A drawdown is measured from the peak, not from the low."}, {"text": "40%", "feedback": "Too big. The fall was $10,000, measured against the $40,000 peak."}], "answer": 1, "work": "$40,000 − $30,000 = $10,000. $10,000 ÷ $40,000 = 25%."}}], "size-for-drawdown": [{"lesson": "drawdown", "chapter": "portfolio-management", "card": {"type": "check", "title": "Why size for drawdowns?", "q": "What’s the main reason to size your portfolio for a big drawdown?", "options": [{"text": "So you never lose money", "feedback": "No portfolio avoids every loss. The goal is a fall you can live through, so you stay in for the recovery."}, {"text": "So you can sit through the worst and not sell at the bottom", "feedback": "A fall you can live through keeps you in for the recovery."}, {"text": "To make your returns bigger", "feedback": "Sizing for drawdowns is about surviving the fall, not boosting returns."}, {"text": "To avoid paying fees", "feedback": "Fees are a separate cost. Sizing is about a fall you can sit through."}], "answer": 1, "idea": "size-for-drawdown", "work": null}}, {"chapter": "portfolio-management", "challenge": {"lesson": 7, "q": "You have $50,000. In a crash, Mix A could fall 40% and Mix B 15%. You know you’d sell in panic after a $10,000 loss. Which mix fits you?", "options": ["Mix A: more growth is worth it", "Mix B: a fall you can sit through", "Either: drawdowns don’t matter"], "answer": 1, "why": "Mix A’s fall is twice your limit. Pick the fall you can sit through, so you don’t sell at the bottom.", "work": "Mix A: $50,000 × 40% = $20,000. Mix B: $50,000 × 15% = $7,500, under your $10,000.", "visual": {"kind": "barchart", "title": "In a crash", "aside": "on $50,000", "label": "In a crash Mix A falls 40%, Mix B 15%", "groups": [{"label": "Mix A", "values": [-40], "displays": ["−40%"], "tones": ["down"]}, {"label": "Mix B", "values": [-15], "displays": ["−15%"], "tones": ["down"]}]}, "idea": y day. One check a week, holding for months, is position trading."}, {"text": "Position trading", "feedback": "Position trades last weeks to months and need a look about once a week. That fits your Sunday evenings."}, {"text": "Any: style doesn’t matter", "feedback": "Style matters: it has to fit the time you really have. One look a week fits only the slowest style."}], "answer": 2, "idea": "position-trading-weekly", "work": null}}], "few-markets-known-well": [{"lesson": "pick-your-style-and-markets", "chapter": "trading-plan", "card": {"type": "check", "title": "A starter list", "q": "Which list of markets is the better start for a beginner?", "options": [{"text": "Every market on the app, so you never miss a move", "feedback": "Watching everything means knowing nothing well. A short list lets you learn how each market really moves."}, {"text": "4 or 5 markets you follow and understand", "feedback": "A short list lets you learn each market’s normal daily move, busy hours and news dates."}, {"text": "Whatever is trending online today", "feedback": "What’s trending changes every day. You’d never learn how any one market really moves."}, {"text": "Only the markets that moved most this week", "feedback": "Last week’s biggest movers change every week. You’d never learn how any one market really moves."}], "answer": 1, "idea": "few-markets-known-well", "work": null}}], "rule-you-can-see": [{"lesson": "your-entry-rules", "chapter": "trading-plan", "card": {"type": "call", "pose": "point", "title": "Which rule can you follow?", "situation": "You want a rule for when to buy. Which one could you follow the same way every time?", "options": [{"text": "Buy when the stock feels strong", "feedback": "“Feels strong” changes with your mood. A rule must point to something you can see on the chart."}, {"text": "Buy when a rising stock pulls back to its rising 50-day average", "feedback": "You can check it on any chart, any day, and get the same answer."}, {"text": "Buy when people o ", "card": {"type": "exercise", "kind": "choice", "title": "A good check", "q": "Which one belongs on your yes/no checklist?", "options": [{"text": "Is the stock likely to go up?", "feedback": "“Likely to go up” is a guess, and the answer is always yes. A check must be a fact, like whether the stop is set."}, {"text": "Is my stop set before I buy?", "feedback": "It’s a fact you can answer yes or no in a second. That’s what a check should be."}, {"text": "Is it a great company?", "feedback": "“Great company” is an opinion. A check must be a fact you can answer yes or no."}, {"text": "Is everyone talking about it?", "feedback": "What people talk about is noise. A check must be a fact about your own plan."}], "answer": 1, "idea": "checks-are-facts", "work": null}}], "one-no-no-trade": [{"lesson": "your-pre-trade-checklist", "chapter": "trading-plan", "card": {"type": "check", "title": "Five yes, one no", "q": "Five checks say yes. One says no: the trade would take you past your weekly loss limit. What now?", "options": [{"text": "Take it: 5 of 6 is good enough", "feedback": "A checklist isn’t a score. One “no” means no trade, and a loss limit never bends."}, {"text": "Skip it: one “no” means no trade", "feedback": "One “no” means no trade. Your weekly limit never bends, so you wait for next week."}, {"text": "Take it with double size", "feedback": "Double size past your weekly limit makes the damage bigger. One “no” means no trade."}, {"text": "Raise your weekly limit", "feedback": "A limit you raise when you hit it was never a limit. One “no” means no trade."}], "answer": 1, "idea": "one-no-no-trade", "work": null}}, {"chapter": "trading-plan", "challenge": {"lesson": 4, "q": "Five checks say yes. One says no: your target is only 1.5× the risk. What should you do?", "options": ["Take it: close enough", "Skip it and wait for a setup that passes", "Move your stop closer to make it 2×"], "answer": 1, "why": "One “no” means no trade. Moving the stop closer only fixes the
