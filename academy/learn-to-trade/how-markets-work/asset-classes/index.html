<script type="application/json" id="ac-lesson">{"lesson": {"id": "asset-classes", "chapter": "how-markets-work", "n": 4, "title": "The six asset classes and their risk", "minutes": 5, "desc": "What you can trade, from lower to higher risk", "cards": [{"type": "call", "pose": "point", "title": "Where does a bad day cost less?", "situation": "You’re new and have $1,000 to practice with. You will make mistakes. Where does one bad day cost you less?", "visual": {"kind": "lines", "layout": "pair", "lo": 0, "hi": 80, "mid": 40, "items": [{"label": "A · Broad index ETF", "sub": "Moves about 1% on a normal day", "tone": "sky", "points": [38, 36, 38, 40, 38, 38, 37, 38, 37, 37, 36, 38, 38, 39, 38, 36, 34, 34, 34, 35, 37, 39, 39, 39, 40, 38, 38, 38, 39, 41]}, {"label": "B · New crypto coin", "sub": "Can swing 10% in a day", "tone": "gold", "points": [37, 30, 22, 9, 8, 8, 21, 22, 10, 8, 8, 19, 20, 27, 26, 23, 37, 45, 51, 40, 32, 42, 33, 43, 40, 51, 65, 54, 62, 70]}]}, "options": [{"text": "The broad index ETF", "feedback": "Smaller swings make each beginner mistake cheaper, so you can afford to learn."}, {"text": "The new crypto coin", "feedback": "Big swings cut both ways, and beginners make more mistakes."}, {"text": "No real difference", "feedback": "A 1% day and a 10% day are very different on the same $1,000. Bigger swings mean bigger bad days."}], "answer": 0, "idea": "learn-on-calm-markets", "work": "Bad day on A: 1% of $1,000 = $10. On B: 10% = $100."}, {"type": "walkthrough", "title": "What do you actually own?", "text": "Tap each tile to see what you own in each [[asset-class|asset class]].", "blocks": [{"side": true, "visual": {"kind": "tiles", "cols": 2, "items": [{"title": "Bonds", "text": "A loan to a government or company. Pays interest.", "icon": "bond", "tone": "sky"}, {"title": "Broad index ETFs", "text": "A basket of many companies in one ticker. An ETF is only as calm as what it holds.", "icon": "basket", "tone": "primary"}, {"title": "Stocks", "text": "A slice of one company.", "icon": "stock", "tone": "blue"}, {"title": "Commodities", "text": "Oil, gold, wheat, copper.", "icon": "commodity", "tone": "amber"}, {"title": "Forex", "text": "One currency against another, like EUR/USD.", "icon": "forex", "tone": "pro"}, {"title": "Crypto", "text": "Digital tokens like BTC and ETH. Trades 24/7.", "icon": "crypto", "tone": "gold"}]}}]}, {"type": "learn", "title": "When can you trade it?", "text": "Markets follow the sun: as one city closes, another opens, so something is always trading somewhere.", "blocks": [{"visual": {"kind": "sessions", "title": "The trading day around the world", "zone": "UTC, winter", "label": "Forex passes from Sydney (10pm to 7am UTC) to Tokyo (midnight to 9am) to London (8am to 5pm) to New York (1pm to 10pm). Busiest from 1pm to 5pm, when London and New York overlap. US stocks open 2:30pm to 9pm UTC, with pre-market from 9am and after-hours to 1am. Crypto never closes.", "ticks": [0, 6, 12, 18, 24], "busy": {"from": 13, "to": 17, "label": "Busiest", "note": "London and New York both open: more traders, tighter spreads, bigger moves."}, "rows": [{"label": "Sydney", "tone": "sky", "bands": [{"from": 0, "to": 7}, {"from": 22, "to": 24}]}, {"label": "Tokyo", "tone": "blue", "bands": [{"from": 0, "to": 9}]}, {"label": "London", "tone": "pro", "bands": [{"from": 8, "to": 17}]}, {"label": "New York", "tone": "up", "bands": [{"from": 13, "to": 22}]}, {"label": "US stocks", "tone": "coral", "note": "open 9:30am–4pm New York time. Pre-market and after-hours (pale): fewer traders, wider spreads.", "bands": [{"from": 0, "to": 1, "soft": true}, {"from": 9, "to": 14.5, "soft": true}, {"from": 14.5, "to": 21, "text": "Open"}, {"from": 21, "to": 24, "soft": true}]}, {"label": "Crypto", "tone": "gold", "note": "never closes, weekends included.", "bands": [{"from": 0, "to": 24, "text": "24/7"}]}], "foot": "Forex passes from Sydney to Tokyo to London to New York, 24 hours on weekdays. Add 1 hour in summer. Times are approximate."}, "side": true}, {"tip": "Trade when the market is **busy**: more traders, tighter spreads.", "side": true, "tone": "plain"}]}, {"type": "learn", "title": "Lower risk to higher risk", "text": "**[[volatility|Volatility]]** is how much a price swings. Higher possible reward usually comes with **higher risk**.", "blocks": [{"visual": {"kind": "ladder", "from": "Lower risk", "to": "Higher risk", "rows": [{"label": "Lower risk", "text": "Bonds · Broad index ETFs", "tone": "sky"}, {"label": "Middle", "text": "Stocks · Commodities · Forex", "tone": "gold"}, {"label": "Higher risk", "text": "Crypto", "tone": "down"}]}, "side": true}, {"tip": "Forex prices usually move slowly, but most people trade it with borrowed money (leverage). That makes it risky. More in Chapter 2."}]}, {"type": "myth", "title": "The fast lane?", "myth": "Crypto and forex with leverage are the fastest way to get rich.", "reality": "They’re the riskiest. Big swings, or borrowed money, make mistakes as big as wins, and beginners make more mistakes. Most professionals learn on lower-risk, liquid assets first."}, {"type": "exercise", "kind": "sort", "title": "Sort by risk", "q": "Drag each asset class into the right box.", "idea": "asset-class-risk-ladder", "items": ["Crypto", "Stocks", "Broad index ETFs", "Forex", "Commodities"], "given": [{"item": "Bonds", "bucket": "lower"}], "buckets": [{"id": "lower", "label": "Lower risk", "sub": "smaller swings", "tone": "sky"}, {"id": "middle", "label": "Middle", "tone": "gold"}, {"id": "higher", "label": "Higher risk", "sub": "biggest swings", "tone": "down"}], "solution": {"lower": ["Broad index ETFs"], "middle": ["Stocks", "Forex", "Commodities"], "higher": ["Crypto"]}, "itemFeedback": {"Forex": "Forex prices move slowly, so on its own it sits in the middle. Leverage is what makes it risky.", "Crypto": "Crypto swings the most: young, very volatile, and it never sleeps.", "Stocks": "One company can move a lot more than a bond or a basket, but less than crypto: the middle.", "Commodities": "Oil and gold swing more than bonds, less than crypto: the middle.", "Broad index ETFs": "A broad index ETF holds hundreds of companies, so one bad company hurts less. That’s why it sits with bonds. A leveraged or crypto ETF would not."}, "right": "Bonds and broad index ETFs are lower risk, stocks, commodities and forex sit in the middle, and crypto is the riskiest."}, {"type": "check", "pose": "detective", "title": "Which is the riskiest?", "q": "Your friend wants to practice with his first $500. Which of these usually carries the most risk?", "options": [{"text": "A government bond", "feedback": "A government bond is a loan that pays interest. It’s one of the calmest choices, not the riskiest."}, {"text": "A broad index ETF", "feedback": "An index ETF spreads your money over many companies, so it swings less than any one of them."}, {"text": "Shares of a large company", "feedback": "Large company shares do move. A brand-new coin can swing far more, and few people trade it, so getting out can be hard."}, {"text": "A brand-new crypto coin", "feedback": "A brand-new coin can swing far more than the others, and few people trade it, so getting out can be hard."}], "answer": 3, "idea": "new-coins-riskiest"}, {"type": "keep", "headline": "You can rank what you trade by risk.", "lines": ["From calmer to wilder: bonds and broad index ETFs, then stocks, commodities and forex, then crypto.", "More possible reward usually means more risk.", "Practice on lower-risk, liquid assets first."]}]}, "chapter": {"id": "how-markets-work", "n": 1, "title": "How Markets Actually Work", "short": "Markets", "index": 3, "count": 5}, "next": {"id": "bid-ask-spread", "n": 5, "title": "Bid, ask and the spread", "minutes": 5}, "nextChapter": null, "first": "bulls-vs-bears"}</script>
