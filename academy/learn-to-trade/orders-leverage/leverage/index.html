<script type="application/json" id="ac-lesson">{"lesson": {"id": "leverage", "chapter": "orders-leverage", "n": 3, "title": "Leverage, the double-edged sword", "minutes": 5, "desc": "What leverage does to gains, losses and stress", "cards": [{"type": "call", "pose": "detective", "name": "Generous broker", "title": "What’s the catch?", "situation": "A broker offers: “Deposit $1,000 and trade as if you had $10,000.” If the price rises 10%, you’d make $1,000 instead of $100. What’s the catch?", "visual": {"kind": "flow", "items": [{"top": "You", "value": "$1,000", "tone": "gold"}, {"value": "?", "tone": "gold"}, {"top": "Trade", "value": "$10,000", "tone": "gold", "active": true}]}, "options": [{"text": "No catch: it’s a free boost", "feedback": "It feels like free money. But the broker isn’t giving you anything. A 10% fall on the bigger position wipes out your whole deposit."}, {"text": "Just a small fee", "feedback": "There are fees (Lesson 4), but they aren’t the main catch. The real catch is size: a 10% fall takes everything you put in."}, {"text": "If the price falls, the loss is 10 times bigger too", "feedback": "Leverage makes every move bigger in both directions. A 10% rise doubles your money, and a 10% fall takes all of it."}], "answer": 2, "idea": "leverage-cuts-both-ways", "work": "10% of the $10,000 position = $1,000 loss on a 10% fall. That equals your whole $1,000 deposit."}, {"type": "learn", "tag": "in one line", "title": "Leverage and margin", "text": "That offer is **[[leverage|leverage]]**: controlling a big position with a small deposit, called **[[margin|margin]]**. One line to remember: position = margin × leverage. $1,000 × 10 = $10,000. Leverage multiplies everything: gains, losses and stress. 10× to 100× is offered on forex, CFDs, futures and crypto. A US stock account allows about 2× (4× intraday for day traders).", "visual": {"kind": "equation", "terms": [{"value": "$1,000", "label": "margin", "tone": "gold"}, {"op": "×"}, {"value": "10", "label": "leverage", "tone": "white"}, {"op": "="}, {"value": "$10,000", "label": "position", "tone": "up"}]}}, {"type": "walkthrough", "tag": "drag", "title": "Move the price", "text": "You have $1,000 at 10×, a $10,000 position. Drag the price. A 1% move is $100, which is 10% of your money. A 10% move is $1,000, which is all of it.", "visual": {"kind": "slider", "model": "leverage", "value": -10, "label": "$1,000 AT 10× · A $10,000 POSITION", "params": {"margin": 1000, "leverage": 10, "min": -10, "max": 10, "step": 1, "marks": [{"at": -10, "label": "−10%"}, {"at": -5, "label": "−5%: $500"}, {"at": 1, "label": "+1%: $1,100"}, {"at": 10, "label": "+10%"}], "pnlLabel": "POSITION P&L", "equityLabel": "YOUR $1,000 NOW", "wipeout": "WIPED OUT", "foot": "Price moves −10% → you lose 100%."}}}, {"type": "learn", "tag": "tap a bar", "title": "The wipe-out rule", "text": "The higher the leverage, the smaller the move that takes all your margin. Shortcut: 100% ÷ leverage. 10× → 10%. 20× → 5%. 100× → 1%. At 1×, a 5% drop costs you just 5%.", "visual": {"kind": "bars", "caption": "MOVE AGAINST YOU THAT WIPES OUT YOUR MARGIN", "max": 100, "bars": [{"label": "1×", "value": 100, "display": "100% move", "tone": "down", "sub": "100% ÷ 1 = 100%"}, {"label": "10×", "value": 10, "display": "10% move", "tone": "down", "sub": "100% ÷ 10 = 10%"}, {"label": "20×", "value": 5, "display": "5% move", "tone": "down", "sub": "100% ÷ 20 = 5%"}, {"label": "100×", "value": 1, "display": "1% move", "tone": "down", "sub": "100% ÷ 100 = 1%"}]}}, {"type": "learn", "tag": "the catch", "title": "The broker closes you first", "text": "Before your margin hits zero, your broker steps in: a **[[margin-call|margin call]]** asks for more money, or a forced close-out sells your position for you and locks in the loss. In a fast gap the price can jump past it, and you can lose more than your deposit.", "visual": {"kind": "stack", "items": [{"kind": "rows", "title": "AS THE TRADE GOES AGAINST YOU", "rows": [{"label": "Your deposit at 10×", "value": "$1,000", "tone": "gold"}, {"label": "Broker closes you", "value": "~$500 left", "tone": "amber"}, {"label": "A gap jumps past it", "value": "below $0", "tone": "down"}]}, {"kind": "stats", "cols": 1, "items": [{"label": "UK and EU", "text": "Retail accounts are protected from going below zero. Elsewhere, check before you use leverage.", "tone": "gold"}]}]}}, {"type": "myth", "title": "Small account, big leverage?", "myth": "Leverage is how small accounts get big.", "reality": "Leverage is how small accounts get small faster. Regulators in the UK and EU make brokers of leveraged products publish how many retail clients lose money. It’s typically most of them. Use leverage only after you have a proven, risk-managed strategy."}, {"type": "exercise", "kind": "choice", "name": "Do the math", "title": "5× on $2,000", "q": "The price falls 4%. What do you lose?", "idea": "leverage-loss-math", "fields": [{"label": "Margin", "value": "$2,000"}, {"label": "Leverage", "value": "5×"}, {"label": "Move", "value": "−4%"}], "options": [{"text": "$80, which is 4% of your margin", "feedback": "That would be right with no leverage. But the 4% move hits the whole position, which is five times your margin."}, {"text": "$2,000, all of it", "feedback": "Leverage makes it feel like everything is at risk. But at 5×, it takes a 20% move to wipe you out. A 4% move costs only part of it."}, {"text": "$400, which is 20% of your margin", "feedback": "With leverage, work out the position first, then apply the move to it. Then compare the loss with your margin."}, {"text": "$8", "feedback": "The percent slipped. Take 4% of the whole position, and check the decimal point."}], "answer": 2, "work": "Position: $2,000 margin × 5 = $10,000. Loss: 4% × $10,000 = $400. $400 loss ÷ $2,000 margin = 20% of your margin lost."}, {"type": "check", "title": "The wipe-out move", "q": "With 10× leverage, how far must price move against you to wipe out your margin?", "options": [{"text": "50%", "feedback": "Far less is needed. At 10×, a 50% move would cost five times your margin."}, {"text": "10%", "feedback": "Your position is 10 times your margin. So a move of one tenth of 100% against you equals all your margin."}, {"text": "1%", "feedback": "That would be true at 100× leverage. At 10×, you need a much bigger move to lose everything."}, {"text": "5%", "feedback": "That would be true at 20× leverage. At 10×, it takes twice that move to lose everything."}], "answer": 1, "idea": "wipe-out-move", "work": "100% of your margin ÷ 10× leverage = a 10% move against you wipes it out.", "pose": "none"}, {"type": "keep", "headline": "You can see what leverage really does to your money.", "lines": ["Position = margin × leverage.", "Wipe-out move = 100% ÷ leverage (10× → 10%).", "A margin call or forced close-out comes before zero, but a gap can cost more than your deposit."]}]}, "chapter": {"id": "orders-leverage", "n": 2, "title": "Orders, Leverage & the Mechanics", "short": "Orders", "index": 2, "count": 5}, "next": {"id": "hidden-costs", "n": 4, "title": "The costs nobody advertises", "minutes": 5}, "nextChapter": null, "first": "bulls-vs-bears"}</script>
<script type="application/json" id="ac-glossary">{"leverage": {"term": "Leverage", "short": "Controlling a bigger position than your money, using borrowed funds. It multiplies gains, losses and stress."}, "margin": {"term": "Margin", "short": "The deposit needed to open a leveraged position. Position = margin × leverage."}, "margin-call": {"term": "Margin call", "short": "A demand from your broker to add money when losses eat into your margin. It comes before your margin is gone, and the broker may close your trade."}}</script>
